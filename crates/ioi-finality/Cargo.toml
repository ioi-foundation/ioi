[package]
name = "ioi-finality"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Source-neutral finality evidence and externally rooted portable AFT assurance verification."

[dependencies]
base64 = { workspace = true }
hex = { workspace = true }
ioi-api = { path = "../api" }
ioi-crypto = { path = "../crypto" }
ioi-types = { path = "../types" }
serde = { workspace = true }
serde_json = { workspace = true }
serde_jcs = { workspace = true }
sha2 = "0.10"
thiserror = { workspace = true }

[features]
default = []
portable-assurance = ["ioi-crypto/aft-terminal-seals"]

[dev-dependencies]
tempfile = { workspace = true }
ml-dsa = "=0.1.1"
slh-dsa = { workspace = true }

[[bin]]
name = "ioi-receipt-proof-verify"
path = "src/main.rs"
required-features = ["portable-assurance"]
