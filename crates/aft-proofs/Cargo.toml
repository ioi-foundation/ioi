[workspace]
members = ["program", "harness"]
resolver = "2"

# sp1 precompile patches: in-guest sha2/ed25519 run against accelerated
# circuits instead of pure-RISC-V bit twiddling.
[patch.crates-io]
sha2 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", tag = "patch-sha2-0.10.9-sp1-4.0.0" }
curve25519-dalek = { git = "https://github.com/sp1-patches/curve25519-dalek", tag = "patch-4.1.3-sp1-5.0.0" }
