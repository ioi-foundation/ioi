name: Build private AFT benchmark image

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Full committed source revision to build
        required: true
        type: string
      push_private_image:
        description: Push to GHCR after confirming the package remains private
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Refuse mutable or foreign source refs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ inputs.source_ref }}"
          test -z "$(git status --porcelain)"

      - uses: docker/setup-buildx-action@v3

      - name: Authenticate to GHCR for an explicitly approved private push
        if: ${{ inputs.push_private_image }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build immutable benchmark image without publishing
        id: build_only
        if: ${{ !inputs.push_private_image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: internal-docs/architecture/protocols/aft/bench/akash/Dockerfile
          build-args: IOI_COMMIT=${{ inputs.source_ref }}
          push: false
          tags: ghcr.io/ioi-foundation/ioi-aft-bench:${{ inputs.source_ref }}
          outputs: type=oci,dest=/tmp/aft-bench.tar

      - name: Build and push explicitly approved private image
        id: push
        if: ${{ inputs.push_private_image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: internal-docs/architecture/protocols/aft/bench/akash/Dockerfile
          build-args: IOI_COMMIT=${{ inputs.source_ref }}
          push: true
          tags: ghcr.io/ioi-foundation/ioi-aft-bench:${{ inputs.source_ref }}

      - name: Record immutable digest
        run: |
          echo 'build-only digest=${{ steps.build_only.outputs.digest }}'
          echo 'pushed digest=${{ steps.push.outputs.digest }}'
          echo 'Use the build-push-action digest from this job; the U1 SDL must use @sha256, never this tag.'

      - name: Retain build-only image for inspection
        if: ${{ !inputs.push_private_image }}
        uses: actions/upload-artifact@v4
        with:
          name: aft-bench-${{ inputs.source_ref }}
          path: /tmp/aft-bench.tar
          retention-days: 1
