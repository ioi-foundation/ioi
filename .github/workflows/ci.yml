name: IOI Kernel CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Cancel superseded runs of the same ref (e.g. a PR force-push) so stale runs
# don't pile up. Runners are GitHub-hosted (isolated VMs), so this is queue
# hygiene, not cross-run contention control.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_test:
    name: Build and Test
    runs-on: ubuntu-latest
    # Hard ceiling so a hung step (e.g. a flaky Ubuntu mirror) fails fast and a
    # rerun lands on a fresh VM, instead of hanging toward the 6h default.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install native deps for kernel build
        run: |
          # Bounded retries + connection timeout: a stuck mirror used to hang
          # this step for hours; now it retries transient failures and fails
          # fast rather than blocking indefinitely.
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y \
            pkg-config \
            cmake \
            libdbus-1-dev \
            protobuf-compiler \
            libxcb1-dev \
            libxdo-dev

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: 1.93.1
          override: true
          components: rustfmt

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      # EVERY GATE REPORTS ON ITS OWN (2026-09-12). Until this date the six contract gates ran in
      # one `run:` block, so the first red aborted the block, and because a failed step skips every
      # later step in the job, one owner's red masked the daemon suite, M06.2's pin, the M04.6
      # floor, the M04.8 matrix, the passkey boundary, the admission mutation battery and the
      # agentgres suite — none of which had run to completion on master since 2026-08-30. Now each
      # gate is its own step; a step that does not depend on an earlier step runs whenever the job
      # is not cancelled, and a step that needs the built daemon runs whenever THAT build succeeded.
      # The job is red if any step is red — nothing is downgraded — but a red names exactly its own
      # gate and hides no other. The two mutation-event coverage gates (`check:mutation-foundation`,
      # `check:mutation-handlers`) moved to the `mutation_event_coverage` job below: they are red on
      # R-18 (decentralized-cloud's, unresolved), and a red that is someone else's belongs in a job
      # that carries their name, not in front of nine gates that are not theirs.
      - name: Verify generated architecture contracts
        run: npm run check:architecture-contracts

      - name: Verify the architecture docs and work-item records
        if: ${{ !cancelled() }}
        run: npm run check:architecture-docs

      - name: Verify the generated surface records
        if: ${{ !cancelled() }}
        run: npm run check:surface-records

      - name: Verify admission-evidence provenance
        if: ${{ !cancelled() }}
        run: npm run check:admission-evidence

      - name: Cache dependencies
        if: ${{ !cancelled() }}
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check format
        if: ${{ !cancelled() }}
        uses: actions-rs/cargo@v1
        with:
          command: fmt
          args: --all -- --check

      - name: Build
        if: ${{ !cancelled() }}
        uses: actions-rs/cargo@v1
        with:
          command: build
          args: --locked --all-features -p ioi-types -p ioi-api -p ioi-pii -p ioi-telemetry

      - name: Build the shipped Hypervisor daemon
        id: daemon_build
        if: ${{ !cancelled() }}
        # mint-approval-grant rides along for the systems journey: its refusal-ladder rung mints
        # a structurally real dcrypt-signed grant (no test-only bypass) and the product_surfaces
        # job installs no Rust toolchain, so the signer must arrive as a built artifact.
        run: cargo build --locked -p ioi-node --bin hypervisor-daemon --bin mint-approval-grant

      # Wired 2026-08-07, once the suite became deterministic. It previously varied run to run —
      # three runs of one tree gave 2, 3 and 4 failures — because fault injection was a
      # process-global env var while Rust runs tests as parallel threads. A suite that answers
      # differently each time cannot gate anything: a green run is not evidence and a red run does
      # not identify a defect. Injection is now thread-local, and this is a real gate.
      - name: Test the shipped Hypervisor daemon
        if: ${{ !cancelled() && steps.daemon_build.outcome == 'success' }}
        run: cargo test --locked -p ioi-node --bin hypervisor-daemon

      # M06.2's FLOOR. The step above runs the daemon's whole suite, so a deleted or renamed test
      # simply stops running and the suite stays green. This wrapper pins the twelve tests that
      # carry typed effect recovery and the two-phase claim by EXACT NAME, requires `--list
      # --exact` to return exactly the pin, and requires passed == pinned with nothing ignored, so
      # removing the proof is red rather than quiet. The binary is already built and tested above.
      - name: Pin the typed effect-recovery population (M06.2)
        if: ${{ !cancelled() && steps.daemon_build.outcome == 'success' }}
        run: npm run check:typed-effect-recovery

      # M04.6's FLOOR, the same failure class as the step above and bound for the same reason: the
      # daemon suite runs the plane's thirteen route tests, so deleting or renaming one stops it
      # running and the suite stays green. This wrapper pins those thirteen AND the twenty-five
      # kernel-core tests by exact name, because the module header is explicit that every mechanic
      # — content commitment, exact-head CAS, chain reconstruction, the rebuildable projection,
      # cancellation planning and archive/snapshot/resume continuity — lives in the core, so
      # pinning only the I/O half would leave the convergence proofs unpinned.
      #
      # COST, STATED RATHER THAN HIDDEN: the second family is `ioi-services --lib`, whose test
      # harness this job does not otherwise compile (it tests six crates under --all-features plus
      # the daemon binary and agentgres). The `rust_library_suite_floor` job measured that suite at
      # 244.8 s on a warm target. It is bound HERE anyway because the daemon-bin half is warm only
      # here, and splitting one population across two jobs would leave two files to keep in sync.
      - name: Pin the work-lifecycle integrity population (M04.6)
        if: ${{ !cancelled() && steps.daemon_build.outcome == 'success' }}
        run: npm run check:work-lifecycle-integrity

      # M05.10 is a Rust-backed live-daemon gate. Keep it beside the daemon build and full daemon
      # test so the Node-only product job never invokes Cargo implicitly. The verifier refuses an
      # out-of-worktree binary and exercises only synthetic records on an isolated data directory.
      - name: Verify vertical ontology pack compilation
        if: ${{ !cancelled() && steps.daemon_build.outcome == 'success' }}
        env:
          IOI_M0510_DAEMON_PREBUILT: "1"
        run: npm run check:vertical-ontology-pack-compiler --workspace=@ioi/hypervisor-app

      # ADR 0038's named merge lane. The full daemon suite above also contains
      # these tests; the exact invocation keeps the M04.8 claim boundary visible
      # and prevents the scheduled real-wallet soak from drifting back into PR CI.
      - name: Verify the deterministic M04.8 architecture matrix
        if: ${{ !cancelled() && steps.daemon_build.outcome == 'success' }}
        run: npm --prefix apps/hypervisor run check:m4-room-participation-contribution-architecture

      # ONE STEP PER GATE (2026-09-12), for the reason stated at the head of this job. These nine
      # ran in one block, and on the first master run after the contract block stopped masking them
      # `mutate:standing-authority` was red — two mutants surviving because a PRESENCE assertion was
      # satisfied by a second, untouched occurrence the code had grown. A block would have hidden
      # the three gates below it as well.
      - name: Verify the passkey identity plane stays separate from effect authority
        if: ${{ !cancelled() && steps.daemon_build.outcome == 'success' }}
        run: npm run check:device-custody-boundary

      - name: Verify that separation goes red on its own planted defects
        if: ${{ !cancelled() && steps.daemon_build.outcome == 'success' }}
        run: npm run mutate:device-custody-boundary

      - name: Verify the secret custody profile
        if: ${{ !cancelled() && steps.daemon_build.outcome == 'success' }}
        run: npm run check:secret-custody-profile

      - name: Verify the secret custody profile goes red on its own planted defects
        if: ${{ !cancelled() && steps.daemon_build.outcome == 'success' }}
        run: npm run mutate:secret-custody-profile

      - name: Verify the standing authority envelope and its draw-down
        if: ${{ !cancelled() && steps.daemon_build.outcome == 'success' }}
        run: npm run check:standing-authority

      - name: Verify the standing authority battery goes red on its own planted defects
        if: ${{ !cancelled() && steps.daemon_build.outcome == 'success' }}
        run: npm run mutate:standing-authority

      - name: Verify the authority trajectory admission tests
        if: ${{ !cancelled() && steps.daemon_build.outcome == 'success' }}
        run: npm run test:authority-trajectory-admission

      - name: Verify authority trajectory admission
        if: ${{ !cancelled() && steps.daemon_build.outcome == 'success' }}
        run: npm run check:authority-trajectory-admission

      - name: Verify trajectory admission goes red on its own planted defects
        if: ${{ !cancelled() && steps.daemon_build.outcome == 'success' }}
        run: npm run mutate:authority-trajectory-admission

      # M06.5's two census residuals. Bound here rather than in the Rust-backed family because it
      # reads rustc's own dep-info for the daemon binary, which exists only where that binary was
      # built — and it rebuilds to make sure the file set it entails is THIS tree's.
      - name: Verify the admission census is entailed from what the compiler read (M06.5)
        if: ${{ !cancelled() && steps.daemon_build.outcome == 'success' }}
        run: npm run check:admission-census-entailment

      - name: Verify that entailment goes red on its own planted defects
        if: ${{ !cancelled() && steps.daemon_build.outcome == 'success' }}
        run: npm run mutate:admission-census-entailment

      # M08.6's five canon-document residuals, as standing properties. It reads the daemon's own
      # route registrations, so it sits beside the build that produces them.
      - name: Verify the canon-document residuals stay closed (M08.6)
        if: ${{ !cancelled() && steps.daemon_build.outcome == 'success' }}
        run: npm run check:canon-document-residuals

      - name: Verify those residual properties go red on their own planted defects
        if: ${{ !cancelled() && steps.daemon_build.outcome == 'success' }}
        run: npm run mutate:canon-document-residuals

      # M08.7, re-scoped to the tracked population by R-40: the gitignored corpus cannot be gated.
      # No daemon needed — it reads canon and the reference terminal artifacts.
      - name: Verify the retired doctrine asserts itself nowhere in tracked canon (M08.7)
        if: ${{ !cancelled() }}
        run: npm run check:prompt-corpus-currentness

      - name: Verify that currentness check goes red on its own planted defects
        if: ${{ !cancelled() }}
        run: npm run mutate:prompt-corpus-currentness


      # A green verifier certifies nothing until a MUTATION proves it red on its own finding. Every
      # anchor is a replayable second-admission path planted in the daemon's own source, with the
      # assertion it must turn red named beside it — and the harness re-derives the population pins
      # the mutant moves first, because a landing commit does, and a pin bump is not a property.
      # It runs HERE, in the Rust job, because each anchor is scored by a `cargo check --bin
      # hypervisor-daemon` that must be REAL: the daemon was just built and tested above, so the
      # target dir is warm and each check is incremental. The product_surfaces job installs no Rust
      # toolchain, so a cold full-daemon check there exits 101 with no rustc error line — which the
      # battery correctly reports as a BLOCKED compile check rather than as a passing run.
      - name: Replay the admission census mutation battery
        if: ${{ !cancelled() && steps.daemon_build.outcome == 'success' }}
        run: npm run mutate:ontology-admission-census --workspace=@ioi/hypervisor-app

      - name: Test the Agentgres substrate
        if: ${{ !cancelled() }}
        run: cargo test --locked -p agentgres

      - name: Publish the shipped Hypervisor daemon for live product smoke
        if: ${{ !cancelled() && steps.daemon_build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: hypervisor-daemon-linux-debug
          if-no-files-found: error
          path: |
            target/debug/hypervisor-daemon
            target/debug/mint-approval-grant

      - name: Smoke implementation-complete daemon paths
        id: smoke_daemon
        if: ${{ !cancelled() && steps.daemon_build.outcome == 'success' }}
        run: npm run smoke:implementation-daemon

      # Evidence is published whenever the smoke RAN (green or red). `if: always()` used to make
      # this upload itself red — "no files found" — whenever the smoke was skipped, which added a
      # noise red to every run whose real red was upstream.
      - name: Publish implementation daemon smoke evidence
        if: ${{ !cancelled() && steps.smoke_daemon.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: implementation-daemon-smoke-evidence
          include-hidden-files: true
          if-no-files-found: error
          path: .artifacts/implementation/daemon-smoke

      - name: Smoke the canonical package registry through restart
        id: smoke_registry
        if: ${{ !cancelled() && steps.daemon_build.outcome == 'success' }}
        run: npm run smoke:package-registry

      - name: Publish package registry smoke evidence
        if: ${{ !cancelled() && steps.smoke_registry.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: package-registry-smoke-evidence
          include-hidden-files: true
          if-no-files-found: error
          path: .artifacts/implementation/package-registry-smoke

      - name: Run tests
        if: ${{ !cancelled() }}
        uses: actions-rs/cargo@v1
        with:
          command: test
          args: --locked --all-features -p ioi-types -p ioi-api -p ioi-pii -p ioi-telemetry

      # Four independent convergent-fault-tolerance properties, one step each (2026-09-12): in one
      # block the first red hid the other three, and these are four different claims about four
      # different mechanisms.
      - name: Convergent fault tolerance — guardian majority safety below the quorum-intersection budget
        if: ${{ !cancelled() }}
        run: cargo test --locked -p ioi-consensus --features aft guardian_majority_safety_holds_below_quorum_intersection_budget -- --nocapture

      - name: Convergent fault tolerance — deterministic witness-certificate assignment for nested guardians
        if: ${{ !cancelled() }}
        run: cargo test --locked -p ioi-consensus --features aft experimental_nested_guardian_accepts_deterministically_assigned_witness_certificate -- --nocapture

      - name: Convergent fault tolerance — refusal of an unsafe odd-sized guardian committee under production policy
        if: ${{ !cancelled() }}
        run: cargo test --locked -p ioi-services rejects_unsafe_odd_sized_guardian_committee_under_production_policy -- --nocapture

      - name: Convergent fault tolerance — the boundary-ring reference trace against its committed golden
        if: ${{ !cancelled() }}
        run: cargo test --locked -p ioi-consensus --features aft boundary_ring_reference_trace_matches_committed_golden -- --nocapture


  # THE MUTATION-EVENT COVERAGE GATES, ON THEIR OWN RUNNER UNDER THEIR OWNER'S NAME (2026-09-12).
  # `check:mutation-foundation` and `check:mutation-handlers` are red on master: the coverage
  # registry (docs/architecture/_meta/mutation-event-foundation-coverage.v1.json) is stale on
  # `handle_cloud_job_execute` (cloud_job_routes.rs, 49eecf0bc), which meets both discarded-write
  # tests in source and is classified in neither MEF-GAP-008 nor a recorded absence. That is the
  # private register's R-18 and it belongs to the decentralized-cloud program, which owns the
  # handler; this program does not resolve it. Until 2026-09-12 the two gates ran inside
  # build_and_test's contracts block, where their red aborted the block and masked every later
  # gate of that job. Here their red is exactly one job, named for its owner, that masks nothing:
  # it is not a `needs:` of any other job, and it stays red until R-18's closure (the handler
  # classified in MEF-GAP-008 or its absence recorded with a reason, both gates green), after
  # which it simply stays green here. Nothing is downgraded: a red job is a red run.
  mutation_event_coverage:
    name: Mutation-event coverage gates (R-18, owner decentralized-cloud)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Verify the mutation-event foundation census
        run: npm run check:mutation-foundation

      - name: Verify the mutation-event handler classification
        if: ${{ !cancelled() }}
        run: npm run check:mutation-handlers

  # THE LIBRARY-SUITE FLOOR (2026-09-10, leg 2 of the correctness program before the review;
  # private register R-21). Until this job CI ran the full suite of six crates — the shipped daemon
  # binary and agentgres in build_and_test, and ioi-types/ioi-api/ioi-pii/ioi-telemetry under
  # --all-features there — plus six individually named tests. Every other crate's library suite was
  # uncovered, which is how `ioi-services --lib` stayed red from 2026-08-24 (d33965a9f) to
  # 2026-09-10 without CI noticing. This job runs the library suite of every crate whose suite was
  # measured GREEN on 6bc07025d (leg 2's measurement: one crate at a time, warm shared target dir,
  # CARGO_INCREMENTAL=0; each line carries its own tests · compile s · test s · wall s), plus
  # ioi-services once leg 2's fix landed, so a red in any of them is red here. It is its own job so
  # the floor's cost never pushes build_and_test past its ceiling and a red here names the crate.
  #
  # BUDGET, stated: timeout-minutes 90, the same ceiling as the sibling jobs. Measured cost of the
  # lines below on the qualification host: 2182 s wall (36.4 min) on a warm target with the crate's
  # own test target compiled cold; the shared dependency build on a cache miss comes on top and is
  # the same build build_and_test pays. The whole floor fits the budget, so nothing is left out for
  # cost. Empty suites (0 tests) are floored anyway: the floor is that the suite RUNS, so an empty
  # suite that gains its first red test is red here rather than invisible.
  #
  # NOT floored here, each a typed absence with a closure test:
  #   - ioi-types, ioi-api, ioi-pii, ioi-telemetry: run in build_and_test with --all-features.
  #   - ioi-node: no lib target; its hypervisor-daemon bin suite runs in build_and_test; the suites
  #     of its other ten bins are unmeasured — closure: `cargo test -p ioi-node --bins` measured and
  #     floored.
  #   - aft-c8-verifier, ioi-ontology-census: bin-only crates, no lib target; their bin suites are
  #     unmeasured — closure: `cargo test -p <crate> --bins` measured and floored.
  #   - ioi-consensus runs with --features aft, the estate's wrappers' form (its default example
  #     target does not compile, R-12).
  rust_library_suite_floor:
    name: Rust library-suite floor (R-21)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install native deps for kernel build
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y \
            pkg-config \
            cmake \
            libdbus-1-dev \
            protobuf-compiler \
            libxcb1-dev \
            libxdo-dev

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: 1.93.1
          override: true

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # ONE STEP PER CRATE (2026-09-12). The 25 commands ran in one `set -euo pipefail` block, so
      # the first red crate aborted the block and every crate AFTER it stopped running: on
      # 2026-09-12 `ioi-networking` was red (register R-32) and the seventeen crates below it —
      # execution, vm-wasm, drivers, system, validator, finality, consensus, client, services,
      # cli, zk-types, transport-verifier, http-rpc-gateway, plugin-ibc-service, relayer,
      # tee-driver, zk-driver-succinct — had never once run in CI, which is the same masking
      # defect this floor was built to end one layer up. Each crate is now its own step and runs
      # whenever the job is not cancelled; the job is red if any crate is red, and a red names its
      # crate. The measured cost of each line (tests · compile s · test s · wall s on 6bc07025d,
      # 2026-09-10) stays beside it.

      - name: Library suite — ioi-macros
        if: ${{ !cancelled() }}
        # 0 ·   1.9 ·   0.0 ·   1.9
        run: cargo test --locked -p ioi-macros --lib

      - name: Library suite — ioi-crypto
        if: ${{ !cancelled() }}
        # 65 ·  55.8 ·  21.6 ·  77.5
        run: cargo test --locked -p ioi-crypto --lib

      - name: Library suite — ioi-ipc
        if: ${{ !cancelled() }}
        # 1 ·  59.8 ·   0.0 ·  59.9
        run: cargo test --locked -p ioi-ipc --lib

      - name: Library suite — ioi-tx
        if: ${{ !cancelled() }}
        # 1 · 116.0 ·   0.0 · 116.5
        run: cargo test --locked -p ioi-tx --lib

      - name: Library suite — ioi-state
        if: ${{ !cancelled() }}
        # 17 ·  63.0 ·   8.0 ·  71.5
        run: cargo test --locked -p ioi-state --lib

      - name: Library suite — ioi-storage
        if: ${{ !cancelled() }}
        # 2 ·  55.1 ·   0.1 ·  55.3
        run: cargo test --locked -p ioi-storage --lib

      - name: Library suite — ioi-memory
        if: ${{ !cancelled() }}
        # 7 ·   5.3 ·   0.0 ·   5.4
        run: cargo test --locked -p ioi-memory --lib

      - name: Library suite — ioi-networking
        if: ${{ !cancelled() }}
        # 52 · 111.0 ·  21.8 · 133.2
        run: cargo test --locked -p ioi-networking --lib

      - name: Library suite — ioi-execution
        if: ${{ !cancelled() }}
        # 27 · 109.0 ·   0.0 · 109.3
        run: cargo test --locked -p ioi-execution --lib

      - name: Library suite — ioi-vm-wasm
        if: ${{ !cancelled() }}
        # 0 ·  70.0 ·   0.0 ·  70.9
        run: cargo test --locked -p ioi-vm-wasm --lib

      - name: Library suite — ioi-drivers
        if: ${{ !cancelled() }}
        # 196 ·  68.0 ·  26.4 ·  94.6
        run: cargo test --locked -p ioi-drivers --lib

      - name: Library suite — ioi-system
        if: ${{ !cancelled() }}
        # 0 ·   9.3 ·   0.0 ·   9.3
        run: cargo test --locked -p ioi-system --lib

      - name: Library suite — ioi-validator
        if: ${{ !cancelled() }}
        # 292 · 122.0 ·  21.8 · 144.5
        run: cargo test --locked -p ioi-validator --lib

      - name: Library suite — ioi-finality
        if: ${{ !cancelled() }}
        # 52 ·  55.3 · 131.7 · 187.0
        run: cargo test --locked -p ioi-finality --lib

      - name: Library suite — ioi-consensus
        if: ${{ !cancelled() }}
        # 322 ·   7.8 · 167.0 · 174.9
        run: cargo test --locked -p ioi-consensus --lib --features aft

      - name: Library suite — ioi-client
        if: ${{ !cancelled() }}
        # 3 ·   3.4 ·   0.0 ·   3.5
        run: cargo test --locked -p ioi-client --lib

      - name: Library suite — ioi-services
        if: ${{ !cancelled() }}
        # 3635 · 120.0 · 230.4 · ~350   (3624 at the 2026-09-10 measurement; +1 R-21's fix, +10 M03.7's SIWE verifier. Test seconds re-measured 2026-09-12 on a warm target; the compile figure is the 2026-09-10 one and was not re-measured)
        run: cargo test --locked -p ioi-services --lib

      - name: Library suite — ioi-cli
        if: ${{ !cancelled() }}
        # 15 · 122.0 ·   0.3 · 122.5
        run: cargo test --locked -p ioi-cli --lib

      - name: Library suite — zk-types
        if: ${{ !cancelled() }}
        # 0 ·   2.5 ·   0.0 ·   2.6
        run: cargo test --locked -p zk-types --lib

      - name: Library suite — transport-verifier
        if: ${{ !cancelled() }}
        # 0 · 120.0 ·   0.0 · 120.1
        run: cargo test --locked -p transport-verifier --lib

      - name: Library suite — http-rpc-gateway
        if: ${{ !cancelled() }}
        # 8 ·  62.0 ·   0.0 ·  63.1
        run: cargo test --locked -p http-rpc-gateway --lib

      - name: Library suite — ioi-plugin-ibc-service
        if: ${{ !cancelled() }}
        # 0 ·  73.0 ·   0.0 ·  73.3
        run: cargo test --locked -p ioi-plugin-ibc-service --lib

      - name: Library suite — ioi-relayer
        if: ${{ !cancelled() }}
        # 0 ·  60.0 ·   0.0 ·  60.3
        run: cargo test --locked -p ioi-relayer --lib

      - name: Library suite — ioi-tee-driver
        if: ${{ !cancelled() }}
        # 0 ·  49.0 ·   0.0 ·  49.1
        run: cargo test --locked -p ioi-tee-driver --lib

      - name: Library suite — zk-driver-succinct
        if: ${{ !cancelled() }}
        # 4 ·   1.5 ·   0.0 ·   1.6
        run: cargo test --locked -p zk-driver-succinct --lib

  # These verifiers are JavaScript orchestrators, but each intentionally
  # launches focused Cargo tests or a Rust extractor. Give that family its own
  # Rust-capable runner instead of extending the already-long build_and_test
  # gauntlet. Its census is merged later by verifier_family_floor, while the
  # independently running product_surfaces command graph remains Node-only.
  rust_backed_verifiers:
    name: Rust-backed product verifier family
    runs-on: ubuntu-latest
    # Interim hang ceiling only; verifier floors, not elapsed time, are the
    # acceptance doctrine.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install native deps for Rust-backed verification
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y \
            pkg-config \
            cmake \
            libdbus-1-dev \
            protobuf-compiler \
            libxcb1-dev \
            libxdo-dev

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: 1.93.1
          override: true

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Cache Rust-backed verifier dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-backed-verifiers-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # check:env-lease-authority boots target/debug/hypervisor-daemon. Build the
      # current checkout explicitly: a restored target/ is a cache, never proof
      # that the runnable daemon matches this revision.
      - name: Build the daemon the Rust-backed verifiers boot
        id: rust_backed_daemon
        run: cargo build --locked -p ioi-node --bin hypervisor-daemon

      # One step per verifier (2026-09-12): these seven belong to different owners, and in one
      # `run:` block the first red hid the other six — on 2026-09-12 `check:env-lease-authority`
      # was red on a pin and masked `check:ontology-admission-census`, which was red on a
      # different pin. Each step runs whenever the daemon built; the job is red if any is red.
      - name: Verify env-lease authority
        if: ${{ !cancelled() && steps.rust_backed_daemon.outcome == 'success' }}
        env:
          IOI_VERIFIER_CENSUS_DIR: .artifacts/verifier-census
        run: npm run check:env-lease-authority --workspace=@ioi/hypervisor-app

      - name: Verify command-execution guardrails
        if: ${{ !cancelled() && steps.rust_backed_daemon.outcome == 'success' }}
        env:
          IOI_VERIFIER_CENSUS_DIR: .artifacts/verifier-census
        run: npm run check:command-execution-guardrails --workspace=@ioi/hypervisor-app

      - name: Verify the enforcement-coverage producer
        if: ${{ !cancelled() && steps.rust_backed_daemon.outcome == 'success' }}
        env:
          IOI_VERIFIER_CENSUS_DIR: .artifacts/verifier-census
        run: npm run check:enforcement-coverage-producer --workspace=@ioi/hypervisor-app

      - name: Verify runtime tool-contract admission
        if: ${{ !cancelled() && steps.rust_backed_daemon.outcome == 'success' }}
        env:
          IOI_VERIFIER_CENSUS_DIR: .artifacts/verifier-census
        run: npm run check:runtime-tool-contract-admission --workspace=@ioi/hypervisor-app

      - name: Verify provider-proposal provenance
        if: ${{ !cancelled() && steps.rust_backed_daemon.outcome == 'success' }}
        env:
          IOI_VERIFIER_CENSUS_DIR: .artifacts/verifier-census
        run: npm run check:provider-proposal-provenance --workspace=@ioi/hypervisor-app

      - name: Verify the ontology admission census
        if: ${{ !cancelled() && steps.rust_backed_daemon.outcome == 'success' }}
        env:
          IOI_VERIFIER_CENSUS_DIR: .artifacts/verifier-census
        run: npm run check:ontology-admission-census --workspace=@ioi/hypervisor-app

      - name: Verify the governed-effect assurance floor
        if: ${{ !cancelled() && steps.rust_backed_daemon.outcome == 'success' }}
        env:
          IOI_VERIFIER_CENSUS_DIR: .artifacts/verifier-census
        run: npm run check:governed-effect-assurance-floor --workspace=@ioi/hypervisor-app

      - name: Publish the Rust-backed verifier census
        if: ${{ !cancelled() && steps.rust_backed_daemon.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: rust-backed-verifier-census
          include-hidden-files: true
          if-no-files-found: error
          path: .artifacts/verifier-census

  # The two M04 plane verifiers are deliberately isolated from both existing
  # jobs. They build the current daemon, focused Rust tests, and the real
  # wallet.network authority fixture, so the Node-only product job cannot run
  # them. Keeping this as a parallel Rust job also avoids extending the already
  # serial build_and_test gauntlet. The 120-minute timeout is an interim hang
  # ceiling, not a performance target or accepted runtime doctrine; emitted
  # census artifacts retain the exact M04.9 floors for verifier_family_floor.
  m4_plane_verifiers:
    name: M04 daemon-backed plane verifier (${{ matrix.verifier_id }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - verifier_id: goalrun-activation-plane
          - verifier_id: outcome-room-system-spine
    # Each matrix entry gets a separate runner and 120-minute interim hang
    # ceiling. This is not a performance threshold or accepted runtime doctrine.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install native deps for daemon-backed verification
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y \
            pkg-config \
            cmake \
            libdbus-1-dev \
            protobuf-compiler \
            libxcb1-dev \
            libxdo-dev \
            bubblewrap

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: 1.93.1
          override: true

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Cache M04 verifier dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-m4-plane-cargo-${{ matrix.verifier_id }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-m4-plane-cargo-${{ matrix.verifier_id }}-
            ${{ runner.os }}-cargo-

      - name: Prebuild the daemon, signer, and wallet fixture binaries
        run: |
          cargo build --locked -p ioi-node --bin hypervisor-daemon --bin mint-approval-grant
          cargo test --locked --release -p ioi-cli --test hypervisor_wallet_network_fixture --no-run
          # The fixture builds this exact feature set in a separate FNV-1a-keyed
          # target directory during readiness. Populate it before the verifier
          # starts so a cold compile cannot consume its readiness ceiling.
          NODE_FEATURES="validator-bins,consensus-aft,state-iavl,commitment-hash,vm-wasm"
          NODE_DIR="target/test-node-builds/release-$(python3 - "$NODE_FEATURES" <<'PYEOF'
          import sys
          value = 0xcbf29ce484222325
          for byte in sys.argv[1].encode():
              value ^= byte
              value = (value * 0x100000001b3) & 0xFFFFFFFFFFFFFFFF
          print(f"{value:016x}")
          PYEOF
          )"
          CARGO_TARGET_DIR="$NODE_DIR" cargo build --locked --release -p ioi-node \
            --no-default-features --features "$NODE_FEATURES"
          # AND WRITE THE MARKER, or the prebuild above buys nothing (2026-09-12, private register
          # R-34's recorded second cause, now fixed). The harness does not decide reuse by "are the
          # binaries present" — `node_profile_needs_build` reads `.ioi-source-revision` from this
          # directory and rebuilds unless it equals the checkout's source identity. This step
          # populated the directory and never wrote the marker, so the fixture rebuilt all four node
          # binaries INSIDE its 20-minute readiness window every run: the failing logs show it still
          # Compiling when the window closed. The prebuild was real and entirely wasted.
          #
          # On a clean checkout that identity is exactly HEAD (validator.rs `checkout_source_revision`
          # returns the bare sha when the diff, the porcelain status and the untracked set are all
          # empty), so this is reproducible here without duplicating the hashing path. If the tree is
          # NOT clean the marker is deliberately left unwritten and the fixture rebuilds — reusing
          # binaries built from different source is exactly what the marker exists to prevent, and a
          # wrong marker would be worse than none.
          if [ -z "$(git status --porcelain)" ]; then
            git rev-parse HEAD > "$NODE_DIR/.ioi-source-revision"
            echo "node-profile source revision marker: $(cat "$NODE_DIR/.ioi-source-revision")"
          else
            echo "working tree is not clean; leaving the marker unwritten so the fixture rebuilds"
            git status --porcelain | head -20
          fi

      - name: Install the exact Outcome adapter
        if: matrix.verifier_id == 'outcome-room-system-spine'
        run: |
          npm install --global opencode-ai@1.18.25
          test "$(opencode --version)" = "1.18.25"
          command -v bwrap
          bwrap --version

      - name: Cache the exact Outcome model
        if: matrix.verifier_id == 'outcome-room-system-spine'
        uses: actions/cache@v3
        with:
          path: ~/.ollama/models
          key: ollama-qwen2.5-7b-845dbda0ea48

      - name: Provision the exact Outcome model route
        if: matrix.verifier_id == 'outcome-room-system-spine'
        run: |
          curl -fsSL https://ollama.com/install.sh | OLLAMA_VERSION=0.18.3 sh
          # The client prints its version in one of two shapes: `ollama version is X` when it can
          # reach a server, and `Warning: client version is X` when it cannot — and right after the
          # installer starts the systemd unit it usually cannot yet, which is why this step read
          # "absent" and failed on every master run from 2026-09-03 to 2026-09-12 (the previous
          # parse accepted only the first shape). Both shapes carry `version is X`; parse that, and
          # print the raw output so the next drift is visible in the log. The exact-version refusal
          # is unchanged.
          ollama --version 2>&1 || true
          OLLAMA_CLIENT_VERSION="$(ollama --version 2>&1 | sed -n 's/^.*version is //p' | tail -n 1)"
          echo "installed Ollama client version: ${OLLAMA_CLIENT_VERSION:-absent}"
          test "$OLLAMA_CLIENT_VERSION" = "0.18.3"
          nohup ollama serve > /tmp/ollama-serve.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null && break
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/ollama-serve.log
              exit 1
            fi
            sleep 2
          done
          ollama pull qwen2.5:7b
          node - <<'NODEEOF'
          const response = await fetch("http://127.0.0.1:11434/api/tags");
          if (!response.ok) throw new Error(`ollama tags returned ${response.status}`);
          const tags = await response.json();
          const model = tags.models?.find((entry) => entry.name === "qwen2.5:7b");
          const expected = "845dbda0ea48ed749caafd9e6037047aa19acfcfd82e704d7ca97d631a0b697e";
          if (model?.digest !== expected) {
            throw new Error(`qwen2.5:7b digest ${model?.digest ?? "absent"} != ${expected}`);
          }
          NODEEOF

      # Keep both literal npm commands visible to check:verifier-floors. Each
      # matrix runner executes exactly one mutually exclusive step.
      - name: Verify the GoalRun activation plane
        if: matrix.verifier_id == 'goalrun-activation-plane'
        env:
          IOI_VERIFIER_CENSUS_DIR: .artifacts/verifier-census
          IOI_WALLET_FIXTURE_READY_TIMEOUT_MS: 1200000
          IOI_WORKLOAD_GRPC_TIMEOUT_MS: 120000
          IOI_ISOLATED_DAEMON_READY_TIMEOUT_MS: 120000
          IOI_WALLET_FIXTURE_RELEASE: "1"
        run: npm run check:m4-goalrun-activation-plane --workspace=@ioi/hypervisor-app

      - name: Verify the OutcomeRoom/System spine
        if: matrix.verifier_id == 'outcome-room-system-spine'
        env:
          IOI_VERIFIER_CENSUS_DIR: .artifacts/verifier-census
          IOI_WALLET_FIXTURE_READY_TIMEOUT_MS: 1200000
          IOI_WORKLOAD_GRPC_TIMEOUT_MS: 120000
          IOI_ISOLATED_DAEMON_READY_TIMEOUT_MS: 120000
          IOI_WALLET_FIXTURE_RELEASE: "1"
        run: |
          # Re-establish the loopback model route in the same step in case the
          # runner reaped a process backgrounded by the provisioning step.
          if ! curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
            nohup ollama serve > /tmp/ollama-serve-verifier.log 2>&1 &
            for attempt in $(seq 1 30); do
              curl -fsS http://127.0.0.1:11434/api/tags >/dev/null && break
              if [ "$attempt" -eq 30 ]; then
                cat /tmp/ollama-serve-verifier.log
                exit 1
              fi
              sleep 2
            done
          fi
          npm run check:m4-outcome-room-system-spine --workspace=@ioi/hypervisor-app

      - name: Publish the M04 plane verifier census
        uses: actions/upload-artifact@v4
        with:
          name: m4-plane-verifier-census-${{ matrix.verifier_id }}
          include-hidden-files: true
          if-no-files-found: error
          path: .artifacts/verifier-census

  product_surfaces:
    name: Product builds and browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Product work needs only the daemon ARTIFACT, and that is now what it waits for rather than
    # what it depends on (2026-09-12, private register R-43). `needs:` alone means "after AND only
    # if green", so any red anywhere in build_and_test's forty-odd gates SKIPPED this job and all
    # 43 of its own — which is how `check:source-neutral` stayed red and invisible from 2026-09-07
    # to 2026-09-12, and how the twenty-three surface journeys stopped running entirely. That is the
    # same masking defect as the `run:` blocks, one level up in the job graph: splitting the steps
    # made each gate report for itself, and a job gated behind another still lost every one of them.
    #
    # `if: !cancelled()` keeps the ordering and drops the conditioning. The artifact download is the
    # real dependency and it fails honestly when the artifact is absent — the upload that produces
    # it is itself gated on the daemon build succeeding, so "the daemon did not build" arrives here
    # as a missing artifact rather than as a silently skipped job. Rust-backed and M04 verifier
    # families run beside it; a small final job merges all census artifacts.
    needs: build_and_test
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Download the built Hypervisor daemon
        id: daemon_artifact
        uses: actions/download-artifact@v4
        with:
          name: hypervisor-daemon-linux-debug
          path: target/debug

      - name: Make the downloaded daemon executable
        if: ${{ !cancelled() && steps.daemon_artifact.outcome == 'success' }}
        run: chmod +x target/debug/hypervisor-daemon target/debug/mint-approval-grant

      - name: Install browser runtime
        if: ${{ !cancelled() }}
        run: npx playwright install --with-deps chromium

      # `check:architecture-contracts` is deliberately NOT repeated here. It shells out to the
      # pinned rustfmt toolchain, and this job installs only Node — so it could never pass in this
      # job, and this step has been failing for exactly that reason. The check already runs in
      # `build_and_test`, which this job `needs:`, so repeating it adds a full Rust toolchain
      # install to a Node-only job for no additional signal.
      # ONE STEP PER GATE (2026-09-12), for the reason stated in build_and_test: the product
      # client contracts, the marketplace suites, the seed/source-neutral verifiers and the
      # twenty-three surface journeys belong to many owners, and in one `run:` block the first red
      # hid every later one (on 2026-09-11 `check:studio-journey`, R-31, would have masked twenty
      # journeys behind it). Steps that need the downloaded daemon run whenever it arrived; steps
      # that need the built products run whenever `build:all` succeeded; the rest run whenever the
      # job is not cancelled. The job is red if any step is red.
      - name: Verify product client contract — check:shipped-products
        if: ${{ !cancelled() }}
        run: npm run check:shipped-products

      - name: Verify product client contract — test:shipped-products
        if: ${{ !cancelled() }}
        run: npm run test:shipped-products

      - name: Verify product client contract — test:hypervisor-scm-publication-client
        if: ${{ !cancelled() }}
        run: npm run test:hypervisor-scm-publication-client

      - name: Verify product client contract — test:hypervisor-domain-app-runtime
        if: ${{ !cancelled() }}
        run: npm run test:hypervisor-domain-app-runtime

      - name: Verify product client contract — test:hypervisor-app-harness
        if: ${{ !cancelled() }}
        run: npm run test:hypervisor-app-harness

      - name: Verify product client contract — test:vite-production-authority-scan
        if: ${{ !cancelled() }}
        run: npm run test:vite-production-authority-scan

      - name: Verify product client contract — test:smoke-fence
        if: ${{ !cancelled() }}
        run: npm run test:smoke-fence

      - name: Verify product client contract — test:product-shell-auth
        if: ${{ !cancelled() }}
        run: npm run test:product-shell-auth --workspace=@ioi/hypervisor-app

      - name: Test the aiagent.xyz marketplace contracts
        if: ${{ !cancelled() }}
        run: npm test --workspace=apps/aiagent-xyz

      - name: Test the sas.xyz marketplace contracts
        if: ${{ !cancelled() }}
        run: npm test --workspace=apps/sas-xyz

      - name: Check the sas.xyz workspace
        if: ${{ !cancelled() }}
        run: npm run check --workspace=apps/sas-xyz

      - name: Build every shipped JavaScript product and package
        id: build_all
        if: ${{ !cancelled() }}
        run: npm run build:all

      - name: Verify live developer documentation contracts
        if: ${{ !cancelled() && steps.build_all.outcome == 'success' }}
        run: npm run validate:live --workspace=apps/developers-ioi-ai

      - name: Verify developer documentation SEO contracts
        if: ${{ !cancelled() && steps.build_all.outcome == 'success' }}
        run: npm run validate:seo --workspace=apps/developers-ioi-ai

      - name: Verify the built developer documentation routes
        if: ${{ !cancelled() && steps.build_all.outcome == 'success' }}
        run: npm run smoke:routes --workspace=apps/developers-ioi-ai


      - name: Verify the aiagent.xyz source graph and built authority boundary
        if: ${{ !cancelled() && steps.build_all.outcome == 'success' }}
        run: npm run check:production --workspace=apps/aiagent-xyz

      - name: Verify the sas.xyz source graph and built authority boundary
        if: ${{ !cancelled() && steps.build_all.outcome == 'success' }}
        run: npm run check:production --workspace=apps/sas-xyz

      - name: Typecheck JavaScript workspaces
        if: ${{ !cancelled() }}
        run: npm run typecheck

      - name: Lint JavaScript workspaces
        if: ${{ !cancelled() }}
        run: npm run lint

      # IOI_VERIFIER_CENSUS_DIR makes each verifier write the runtime assertion
      # census consumed by verifier_family_floor. Missing evidence fails closed.
      - name: Verify the ported seed boundary — owned-product-ui
        if: ${{ !cancelled() }}
        env:
          IOI_VERIFIER_CENSUS_DIR: .artifacts/verifier-census
        run: npm run check:owned-product-ui --workspace=@ioi/hypervisor-app

      - name: Verify the ported seed boundary — shell-parity
        if: ${{ !cancelled() }}
        env:
          IOI_VERIFIER_CENSUS_DIR: .artifacts/verifier-census
        run: npm run check:shell-parity --workspace=@ioi/hypervisor-app

      - name: Verify the ported seed boundary — ported-seed
        if: ${{ !cancelled() }}
        env:
          IOI_VERIFIER_CENSUS_DIR: .artifacts/verifier-census
        run: npm run check:ported-seed --workspace=@ioi/hypervisor-app

      - name: Verify the ported seed boundary — seed-provenance
        if: ${{ !cancelled() }}
        env:
          IOI_VERIFIER_CENSUS_DIR: .artifacts/verifier-census
        run: npm run check:seed-provenance --workspace=@ioi/hypervisor-app

      - name: Verify the ported seed boundary — source-neutral
        if: ${{ !cancelled() }}
        env:
          IOI_VERIFIER_CENSUS_DIR: .artifacts/verifier-census
        run: npm run check:source-neutral --workspace=@ioi/hypervisor-app

      - name: Verify against an isolated live daemon — ontology-journey
        if: ${{ !cancelled() && steps.daemon_artifact.outcome == 'success' }}
        env:
          IOI_VERIFIER_CENSUS_DIR: .artifacts/verifier-census
        run: npm run check:ontology-journey --workspace=@ioi/hypervisor-app

      - name: Verify against an isolated live daemon — governance-journey
        if: ${{ !cancelled() && steps.daemon_artifact.outcome == 'success' }}
        env:
          IOI_VERIFIER_CENSUS_DIR: .artifacts/verifier-census
        run: npm run check:governance-journey --workspace=@ioi/hypervisor-app

      - name: Verify against an isolated live daemon — studio-journey
        if: ${{ !cancelled() && steps.daemon_artifact.outcome == 'success' }}
        env:
          IOI_VERIFIER_CENSUS_DIR: .artifacts/verifier-census
        run: npm run check:studio-journey --workspace=@ioi/hypervisor-app

      - name: Verify against an isolated live daemon — packages-journey
        if: ${{ !cancelled() && steps.daemon_artifact.outcome == 'success' }}
        env:
          IOI_VERIFIER_CENSUS_DIR: .artifacts/verifier-census
        run: npm run check:packages-journey --workspace=@ioi/hypervisor-app

      - name: Verify against an isolated live daemon — automations-journey
        if: ${{ !cancelled() && steps.daemon_artifact.outcome == 'success' }}
        env:
          IOI_VERIFIER_CENSUS_DIR: .artifacts/verifier-census
        run: npm run check:automations-journey --workspace=@ioi/hypervisor-app

      - name: Verify against an isolated live daemon — odk-contract-and-domainapp
        if: ${{ !cancelled() && steps.daemon_artifact.outcome == 'success' }}
        env:
          IOI_VERIFIER_CENSUS_DIR: .artifacts/verifier-census
        run: npm run check:odk-contract-and-domainapp --workspace=@ioi/hypervisor-app

      - name: Verify against an isolated live daemon — skill-contracts
        if: ${{ !cancelled() && steps.daemon_artifact.outcome == 'success' }}
        env:
          IOI_VERIFIER_CENSUS_DIR: .artifacts/verifier-census
        run: npm run check:skill-contracts --workspace=@ioi/hypervisor-app

      - name: Verify against an isolated live daemon — goal-profile-contracts
        if: ${{ !cancelled() && steps.daemon_artifact.outcome == 'success' }}
        env:
          IOI_VERIFIER_CENSUS_DIR: .artifacts/verifier-census
        run: npm run check:goal-profile-contracts --workspace=@ioi/hypervisor-app

      - name: Verify against an isolated live daemon — m3-goalrun-plane
        if: ${{ !cancelled() && steps.daemon_artifact.outcome == 'success' }}
        env:
          IOI_VERIFIER_CENSUS_DIR: .artifacts/verifier-census
        run: npm run check:m3-goalrun-plane --workspace=@ioi/hypervisor-app

      - name: Verify against an isolated live daemon — m4-work-lifecycle-plane
        if: ${{ !cancelled() && steps.daemon_artifact.outcome == 'success' }}
        env:
          IOI_VERIFIER_CENSUS_DIR: .artifacts/verifier-census
        run: npm run check:m4-work-lifecycle-plane --workspace=@ioi/hypervisor-app

      - name: Verify against an isolated live daemon — launch-chain
        if: ${{ !cancelled() && steps.daemon_artifact.outcome == 'success' }}
        env:
          IOI_VERIFIER_CENSUS_DIR: .artifacts/verifier-census
        run: npm run check:launch-chain --workspace=@ioi/hypervisor-app

      - name: Verify against an isolated live daemon — session-authority
        if: ${{ !cancelled() && steps.daemon_artifact.outcome == 'success' }}
        env:
          IOI_VERIFIER_CENSUS_DIR: .artifacts/verifier-census
        run: npm run check:session-authority --workspace=@ioi/hypervisor-app

      - name: Verify against an isolated live daemon — session-authority-profile
        if: ${{ !cancelled() && steps.daemon_artifact.outcome == 'success' }}
        env:
          IOI_VERIFIER_CENSUS_DIR: .artifacts/verifier-census
        run: npm run check:session-authority-profile --workspace=@ioi/hypervisor-app

      - name: Verify against an isolated live daemon — landing-designations
        if: ${{ !cancelled() && steps.daemon_artifact.outcome == 'success' }}
        env:
          IOI_VERIFIER_CENSUS_DIR: .artifacts/verifier-census
        run: npm run check:landing-designations --workspace=@ioi/hypervisor-app

      - name: Verify against an isolated live daemon — projects-saga
        if: ${{ !cancelled() && steps.daemon_artifact.outcome == 'success' }}
        env:
          IOI_VERIFIER_CENSUS_DIR: .artifacts/verifier-census
        run: npm run check:projects-saga --workspace=@ioi/hypervisor-app

      - name: Verify against an isolated live daemon — provider-transport
        if: ${{ !cancelled() && steps.daemon_artifact.outcome == 'success' }}
        env:
          IOI_VERIFIER_CENSUS_DIR: .artifacts/verifier-census
        run: npm run check:provider-transport --workspace=@ioi/hypervisor-app

      - name: Verify against an isolated live daemon — model-route-authority
        if: ${{ !cancelled() && steps.daemon_artifact.outcome == 'success' }}
        env:
          IOI_VERIFIER_CENSUS_DIR: .artifacts/verifier-census
        run: npm run check:model-route-authority --workspace=@ioi/hypervisor-app

      - name: Verify against an isolated live daemon — model-router-decisions
        if: ${{ !cancelled() && steps.daemon_artifact.outcome == 'success' }}
        env:
          IOI_VERIFIER_CENSUS_DIR: .artifacts/verifier-census
        run: npm run check:model-router-decisions --workspace=@ioi/hypervisor-app

      - name: Verify against an isolated live daemon — backup-restore
        if: ${{ !cancelled() && steps.daemon_artifact.outcome == 'success' }}
        env:
          IOI_VERIFIER_CENSUS_DIR: .artifacts/verifier-census
        run: npm run check:backup-restore --workspace=@ioi/hypervisor-app

      - name: Verify against an isolated live daemon — environment-custody
        if: ${{ !cancelled() && steps.daemon_artifact.outcome == 'success' }}
        env:
          IOI_VERIFIER_CENSUS_DIR: .artifacts/verifier-census
        run: npm run check:environment-custody --workspace=@ioi/hypervisor-app

      - name: Verify against an isolated live daemon — operational-depth
        if: ${{ !cancelled() && steps.daemon_artifact.outcome == 'success' }}
        env:
          IOI_VERIFIER_CENSUS_DIR: .artifacts/verifier-census
        run: npm run check:operational-depth --workspace=@ioi/hypervisor-app

      - name: Verify against an isolated live daemon — ontology-backend-families
        if: ${{ !cancelled() && steps.daemon_artifact.outcome == 'success' }}
        env:
          IOI_VERIFIER_CENSUS_DIR: .artifacts/verifier-census
        run: npm run check:ontology-backend-families --workspace=@ioi/hypervisor-app

      - name: Verify against an isolated live daemon — named-gap-truth
        if: ${{ !cancelled() && steps.daemon_artifact.outcome == 'success' }}
        env:
          IOI_VERIFIER_CENSUS_DIR: .artifacts/verifier-census
        run: npm run check:named-gap-truth --workspace=@ioi/hypervisor-app

      - name: Verify the product-shell safety and native-container contracts
        if: ${{ !cancelled() && steps.daemon_artifact.outcome == 'success' }}
        env:
          IOI_VERIFIER_CENSUS_DIR: .artifacts/verifier-census
        run: |
          product_data_dir=$(mktemp -d)
          IOI_HYPERVISOR_DATA_DIR="$product_data_dir" target/debug/hypervisor-daemon > /tmp/ioi-product-daemon.log 2>&1 &
          product_daemon_pid=$!
          npm run serve:product-ui --workspace=@ioi/hypervisor-app > /tmp/ioi-product-ui.log 2>&1 &
          product_ui_pid=$!
          trap 'kill "$product_ui_pid" "$product_daemon_pid" 2>/dev/null || true; rm -r "$product_data_dir"' EXIT
          for attempt in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:4173/__ioi/applications >/dev/null && break
            if [ "$attempt" -eq 60 ]; then
              cat /tmp/ioi-product-daemon.log
              cat /tmp/ioi-product-ui.log
              exit 1
            fi
            sleep 1
          done
          npm run check:app-runtime-safety --workspace=@ioi/hypervisor-app
          npm run check:native-shell --workspace=@ioi/hypervisor-app

      - name: Publish the Node product verifier census
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: product-verifier-census
          include-hidden-files: true
          if-no-files-found: error
          path: .artifacts/verifier-census

      - name: Record post-build shipped-product artifact identities
        if: ${{ !cancelled() && steps.build_all.outcome == 'success' }}
        run: |
          mkdir -p .artifacts/implementation/shipped-products
          for lane in \
            hypervisor-owned-served-ui \
            hypervisor-vite-workbench \
            hypervisor-web \
            developers-ioi-ai \
            aiagent-xyz \
            sas-xyz
          do
            node scripts/validate-shipped-products.mjs \
              --post-build \
              --lane "$lane" \
              --json > ".artifacts/implementation/shipped-products/$lane.json"
          done

      - name: Browser-smoke shipped product routes
        if: ${{ !cancelled() && steps.build_all.outcome == 'success' && steps.daemon_artifact.outcome == 'success' }}
        run: npm run smoke:product-surfaces

      # An ioi.ai web-UI block used to follow here. It was residue of the dual runtime removed under
      # the one-ioi.ai-app ruling, and it could not run: every step carried `../../../../` paths
      # written for a working directory four levels deep, but the block declared no
      # `working-directory`, so `chmod ../../../../target/debug/hypervisor-daemon` reached outside
      # the repo and failed. It also re-ran `npm ci` and re-downloaded the daemon artifact that this
      # job already has. Three of the scripts it invoked — `build`, `smoke:real-daemon`,
      # `smoke:browser` — exist neither at the repo root nor in apps/ioi-ai; the other two duplicate
      # the root `typecheck` and `test` already run above.
      #
      # So there is currently NO CI coverage of the ioi.ai web UI. That is a real gap, left open
      # deliberately rather than closed by guessing: `OQ-4` — whether the ioi.ai web UI ships, and
      # from which root — is an open question in the implementation guide, and inventing a
      # working-directory here would answer it by accident.

  # M03.8's device-held wallet-principal seam, on its own runner because of what it needs rather
  # than where it belongs. It drives a REAL WebAuthn ceremony on a virtual authenticator, so it
  # needs a browser runtime; its composed supplementary (`check:passkey-only-authority`) boots the
  # real wallet.network fixture, so it needs a Rust toolchain; and both boot the daemon, so it needs
  # that built. `build_and_test` has the Rust half and no browser, `product_surfaces` has the
  # browser and no Rust — wiring it into either would have made it BLOCKED or red for its
  # environment rather than for its subject, which is how a gate stops measuring anything. It was
  # in build_and_test for exactly one master run (2026-09-12) and failed there for that reason.
  m038_device_held_principal:
    name: M03.8 device-held wallet-principal seam
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install native deps for daemon-backed verification
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y \
            pkg-config \
            cmake \
            libdbus-1-dev \
            protobuf-compiler \
            libxcb1-dev \
            libxdo-dev

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: 1.93.1
          override: true

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Cache M03.8 verifier dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-m038-device-held-principal-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install the browser runtime the WebAuthn ceremony needs
        run: npx playwright install --with-deps chromium

      # A restored target/ is a cache, never proof that the runnable daemon matches this revision.
      - name: Build the daemon this verifier boots
        id: m038_daemon
        run: cargo build --locked -p ioi-node --bin hypervisor-daemon

      - name: Verify a ceremony provisions a device-held wallet principal and STOPS
        if: ${{ !cancelled() && steps.m038_daemon.outcome == 'success' }}
        run: npm run check:device-held-wallet-principal

      - name: Verify that seam goes red on its own planted defects
        if: ${{ !cancelled() && steps.m038_daemon.outcome == 'success' }}
        run: npm run mutate:device-held-wallet-principal

  # M06.1's deterministic gate on its own runner, beside the other verifier
  # families rather than inside them. It boots the daemon it just built and needs
  # no wallet fixture, model route, or network, so folding it into the M04 matrix
  # would make it pay for provisioning it does not use, and folding it into the
  # serial Rust-backed step would couple two unrelated families' runtimes.
  #
  # The expensive mutation adjudicator is deliberately outside blocking CI and
  # remains available through check:verified-work-graph:scheduled. Blocking CI
  # runs the deterministic producer/consumer/restart proof and publishes its
  # assertion census; scheduled qualification proves the same verifier goes red
  # on every planted target. The timeout below is an operational hang ceiling,
  # not a performance target.
  m061_verified_work_graph:
    name: M06.1 Verified Work Graph plane verifier
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install native deps for daemon-backed verification
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y \
            pkg-config \
            cmake \
            libdbus-1-dev \
            protobuf-compiler \
            libxcb1-dev \
            libxdo-dev

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: 1.93.1
          override: true

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Cache M06.1 verifier dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-m061-verified-work-graph-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # A restored target/ is a cache, never proof that the runnable daemon
      # matches this revision. Build the current checkout explicitly.
      - name: Build the daemon this verifier boots
        run: cargo build --locked -p ioi-node --bin hypervisor-daemon

      # The registered contract, its invariant profile and its fixture corpus are
      # checked with no daemon present, because the offline half has to hold for a
      # relying party who has only the bytes.
      - name: Verify the registered contract projections are current
        run: npm run check:architecture-contracts

      - name: Verify the assurance-transition focused tests
        run: cargo test --locked -p ioi-node --bin hypervisor-daemon assurance_transition_routes::tests

      - name: Verify the WorkResult resolver and graph projection focused tests
        if: ${{ !cancelled() }}
        run: cargo test --locked -p ioi-node --bin hypervisor-daemon work_result_routes::work_result_tests

      - name: Verify the Verified Work Graph plane
        env:
          IOI_VERIFIER_CENSUS_DIR: .artifacts/verifier-census
        run: npm run check:verified-work-graph --workspace=@ioi/hypervisor-app

      - name: Publish the M06.1 verifier census
        uses: actions/upload-artifact@v4
        with:
          name: m061-verified-work-graph-census
          include-hidden-files: true
          if-no-files-found: error
          path: .artifacts/verifier-census

  # Every verifier is pinned at the assertion count it actually executed. This
  # final job starts only after the independent Node, Rust-backed, M04, and M06.1
  # jobs publish their immutable censuses. It invokes no verifier, Cargo build,
  # daemon, or authority path; omission and shrinkage fail closed here.
  # Timeout-graph ceiling (not a performance claim): max(build 90 + product 45,
  # Rust-backed 90, either parallel M04 matrix leg 120, M06.1 90) + floor 20 =
  # 155 minutes. The M06.1 job remains parallel, so the graph maximum is
  # unchanged.
  verifier_family_floor:
    name: Verifier family census floor
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      [
        product_surfaces,
        rust_backed_verifiers,
        m4_plane_verifiers,
        m061_verified_work_graph,
      ]
    # RUNS EVEN WHEN A PRODUCING JOB IS RED (2026-09-12), for the reason the floor exists: this job's
    # whole claim is that omission and shrinkage FAIL CLOSED here. Skipping it because an upstream
    # job failed reports "skipped", which reads as fine; running it reports `census_missing` for the
    # verifiers that did not get to speak, which is what actually happened. The floor is allowed to
    # say it could not be established — it is not allowed to stay silent about it.
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Download the Node product verifier census
        uses: actions/download-artifact@v4
        with:
          name: product-verifier-census
          path: .artifacts/verifier-census

      - name: Download the Rust-backed verifier census
        uses: actions/download-artifact@v4
        with:
          name: rust-backed-verifier-census
          path: .artifacts/verifier-census

      - name: Download both M04 plane verifier censuses
        uses: actions/download-artifact@v4
        with:
          pattern: m4-plane-verifier-census-*
          merge-multiple: true
          path: .artifacts/verifier-census

      - name: Download the M06.1 Verified Work Graph census
        uses: actions/download-artifact@v4
        with:
          name: m061-verified-work-graph-census
          path: .artifacts/verifier-census

      - name: Verify the verifier family did not shrink
        env:
          IOI_VERIFIER_CENSUS_DIR: .artifacts/verifier-census
        run: npm run check:verifier-floors --workspace=@ioi/hypervisor-app

  aft_formal_floor:
    name: AFT Formal Floor
    runs-on: ubuntu-latest
    # A clean cache must download the proof toolchain, discharge every TLAPS
    # obligation, and exhaust the registered TLC state spaces. The previous
    # 30-minute job cap cancelled that complete floor after all cheap gates had
    # passed; cancellation is neither a proof failure nor acceptable evidence.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The census is the floor: every .tla module under the AFT formal tree
      # must be either executed by the harness or carried in
      # manual-discharge.json with a reason. Cheap; runs on every build.
      - name: Formal census (no silent orphan modules)
        run: bash .github/scripts/run_aft_formal_checks.sh --census-only

      # This stdlib-only verifier is deliberately outside the Rust/IOI
      # implementation. Running its committed golden corpus from CI's clean
      # checkout prevents the independent evidence from disappearing behind
      # an ignore rule or existing only in an author's working tree.
      - name: AFT clean-room assurance golden corpus
        run: python3 tools/aft-assurance-cleanroom/verify.py

      # Claim discipline is part of the same floor: no unconditional or
      # rounded tolerance claim in the AFT corpus, and the whitepaper's
      # A1–A9 assumption ledger + interim conditional claim stay intact.
      # Both cheap; run on every build.
      - name: AFT claim discipline (no unconditional / rounded tolerance claims)
        run: bash .github/scripts/check_aft_claim_discipline.sh

      - name: Whitepaper assumption ledger + interim claim intact
        run: bash .github/scripts/check_aft_whitepaper_claims.sh

      # P1.2's machine convention: Assumes-line discipline over the
      # common-boundary theorem corpus (A5/A9/A10 scoping, T8 quarantine,
      # T1 timing denylist, pairing-table completeness).
      - name: Theorem Assumes discipline (common boundary)
        run: bash .github/scripts/check_aft_theorem_assumes.sh

      # R4c's gate: the release tree contains no mock succinct-proof
      # constructor, the succinct continuity lane has no simulated
      # fallback, and the driver pin matches the governed vkey.json.
      - name: No mock proof constructor (succinct lane real-or-refuse)
        run: bash .github/scripts/check_aft_no_mock_proof.sh

      - name: Determine whether formal sources changed
        id: formal_diff
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            RANGE="origin/${{ github.base_ref }}...HEAD"
          else
            BEFORE="${{ github.event.before }}"
            if [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]]; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            RANGE="$BEFORE..${{ github.sha }}"
          fi
          if git diff --name-only $RANGE -- \
              internal-docs/architecture/protocols/aft/formal \
              .github/scripts/run_aft_formal_checks.sh \
              | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Java for TLC
        if: steps.formal_diff.outputs.changed == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Full discharge (4 TLAPS proofs + 6 TLC models) runs when the formal
      # tree or the harness changed; the census above runs unconditionally.
      - name: Full formal discharge (proofs + models)
        if: steps.formal_diff.outputs.changed == 'true'
        run: bash .github/scripts/run_aft_formal_checks.sh
