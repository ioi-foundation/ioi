name: IOI Kernel CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The M4 stage proof as a DISTINCT NAMED job (owner directive 2026-08-01).
  # Why it exists: verify-m4-goalrun-activation-plane.mjs was unrunnable at
  # HEAD since 77117ecd6 — crashing on a fixture that commit deliberately
  # deleted — and nothing detected it, because no stage verifier ran in CI.
  # Green CI that never runs the stage proof is the false-green shape this
  # program keeps paying for. Requirements enforced here: isolated
  # fresh-process state (the verifier builds and pins its own daemon and
  # spawns its own planes), exact 98/98 assertion-count enforcement from the
  # log bytes, raw log retention, a real timeout, pinned-binary line
  # assertion, and NEVER acceptance on the process exit code alone.
  # Mark this job REQUIRED in branch protection (admin action).
  m4_stage_proof:
    name: M4 stage proof (98-assertion aggregate)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v3

      - name: Install native deps for kernel build
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            cmake \
            libdbus-1-dev \
            protobuf-compiler \
            libxcb1-dev \
            libxdo-dev

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: 1.93.1
          override: true

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-m4proof-${{ hashFiles('**/Cargo.lock') }}

      # Environmental provisioning (owner directive 2026-08-01): the verifier
      # hard-gates on a live wallet.network fixture and a live qwen2.5:7b model
      # route. Provision, never relax: the first CI run crashed at
      # M4_ENVIRONMENTAL_PREREQUISITE_FAILED=wallet_network_fixture_unready
      # because the guardian cargo-builds the fixture cold inside its
      # readiness window.
      - name: Cache the feature-isolated node builds
        uses: actions/cache@v3
        with:
          path: target/test-node-builds
          key: ${{ runner.os }}-test-node-builds-${{ hashFiles('**/Cargo.lock') }}

      - name: Prebuild the daemon and the wallet.network fixture binaries
        run: |
          cargo build --bin hypervisor-daemon
          cargo test -p ioi-cli --test hypervisor_wallet_network_fixture --no-run
          # The fixture test builds ioi-node into a feature-isolated target dir
          # AT RUNTIME (crates/cli/src/testing/validator.rs); cold, that build
          # alone exceeds the fixture's 10-minute readiness window — the exact
          # labeled failure of the first two provisioned runs. Prebuild the
          # same binaries into the same dir: feature string and FNV-1a dir
          # hash replicate validator.rs resolve() for the fixture's
          # Aft/IAVL/Hash profile (verified against a local ground-truth dir).
          NODE_FEATURES="validator-bins,consensus-aft,state-iavl,commitment-hash,vm-wasm"
          NODE_DIR="target/test-node-builds/debug-$(python3 - "$NODE_FEATURES" <<'PYEOF'
          import sys
          h = 0xcbf29ce484222325
          for b in sys.argv[1].encode():
              h ^= b
              h = (h * 0x100000001b3) & 0xFFFFFFFFFFFFFFFF
          print('%016x' % h)
          PYEOF
          )"
          echo "prebuilding node binaries into $NODE_DIR"
          CARGO_TARGET_DIR="$NODE_DIR" cargo build -p ioi-node --no-default-features --features "$NODE_FEATURES"

      - name: Cache the qwen2.5:7b model
        uses: actions/cache@v3
        with:
          path: ~/.ollama/models
          key: ollama-qwen2.5-7b-v1

      - name: Provision Ollama and the pinned model route
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > /tmp/ollama-serve.log 2>&1 &)
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:11434/api/tags > /dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:11434/api/tags > /dev/null
          ollama pull qwen2.5:7b

      - name: Run the M4 aggregate verifier on an isolated fresh plane
        run: |
          set -o pipefail
          node apps/hypervisor/scripts/verify-m4-outcome-room-system-spine.mjs 2>&1 | tee m4-aggregate.log

      - name: Enforce the exact count and pinned binary from log bytes (no exit-code-only acceptance)
        run: |
          grep -qx '98/98 passed' m4-aggregate.log
          grep -Eq '^M4_DAEMON_BINARY_SHA256=sha256:[0-9a-f]{64}$' m4-aggregate.log
          grep -q 'M4 outcome-room system spine: PASS' m4-aggregate.log

      - name: Label an environmental prerequisite failure (never accepts it)
        if: failure()
        run: |
          if grep -q '^M4_ENVIRONMENTAL_PREREQUISITE_FAILED=' m4-aggregate.log; then
            echo "::error::environmental prerequisite failure — provisioning gap, not a proof regression: $(grep -m1 '^M4_ENVIRONMENTAL_PREREQUISITE_FAILED=' m4-aggregate.log)"
          else
            echo "::error::proof failure — the verifier ran and refused; read the retained log artifact"
          fi

      - name: Retain the raw proof log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-aggregate-proof-log
          path: m4-aggregate.log

  build_and_test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install native deps for kernel build
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            cmake \
            libdbus-1-dev \
            protobuf-compiler \
            libxcb1-dev \
            libxdo-dev

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: 1.93.1
          override: true
          components: rustfmt

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Canon pre-next-leg bar
        run: npm run check:pre-next-leg

      - name: Check format
        uses: actions-rs/cargo@v1
        with:
          command: fmt
          args: --all -- --check

      - name: Build
        uses: actions-rs/cargo@v1
        with:
          command: build
          args: --locked --all-features -p ioi-types -p ioi-api -p ioi-pii -p ioi-telemetry

      - name: Run tests
        uses: actions-rs/cargo@v1
        with:
          command: test
          args: --locked --all-features -p ioi-types -p ioi-api -p ioi-pii -p ioi-telemetry

      - name: Convergent Fault Tolerance Gates
        run: |
          cargo test --locked -p ioi-consensus --features aft guardian_majority_safety_holds_below_quorum_intersection_budget -- --nocapture
          cargo test --locked -p ioi-consensus --features aft experimental_nested_guardian_accepts_deterministically_assigned_witness_certificate -- --nocapture
          cargo test --locked -p ioi-services rejects_unsafe_odd_sized_guardian_committee_under_production_policy -- --nocapture
