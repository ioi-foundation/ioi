name: IOI Kernel CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Cancel superseded runs of the same ref (e.g. a PR force-push) so stale runs
# don't pile up. Runners are GitHub-hosted (isolated VMs), so this is queue
# hygiene, not cross-run contention control.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_test:
    name: Build and Test
    runs-on: ubuntu-latest
    # Hard ceiling so a hung step (e.g. a flaky Ubuntu mirror) fails fast and a
    # rerun lands on a fresh VM, instead of hanging toward the 6h default.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install native deps for kernel build
        run: |
          # Bounded retries + connection timeout: a stuck mirror used to hang
          # this step for hours; now it retries transient failures and fails
          # fast rather than blocking indefinitely.
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y \
            pkg-config \
            cmake \
            libdbus-1-dev \
            protobuf-compiler \
            libxcb1-dev \
            libxdo-dev

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: 1.93.1
          override: true
          components: rustfmt

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Verify generated architecture contracts
        run: |
          npm run check:architecture-contracts
          npm run check:architecture-docs
          npm run check:surface-records
          npm run check:mutation-foundation
          npm run check:mutation-handlers
          npm run check:admission-evidence

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check format
        uses: actions-rs/cargo@v1
        with:
          command: fmt
          args: --all -- --check

      - name: Build
        uses: actions-rs/cargo@v1
        with:
          command: build
          args: --locked --all-features -p ioi-types -p ioi-api -p ioi-pii -p ioi-telemetry

      - name: Build the shipped Hypervisor daemon
        # mint-approval-grant rides along for the systems journey: its refusal-ladder rung mints
        # a structurally real dcrypt-signed grant (no test-only bypass) and the product_surfaces
        # job installs no Rust toolchain, so the signer must arrive as a built artifact.
        run: cargo build --locked -p ioi-node --bin hypervisor-daemon --bin mint-approval-grant

      # Wired 2026-08-07, once the suite became deterministic. It previously varied run to run —
      # three runs of one tree gave 2, 3 and 4 failures — because fault injection was a
      # process-global env var while Rust runs tests as parallel threads. A suite that answers
      # differently each time cannot gate anything: a green run is not evidence and a red run does
      # not identify a defect. Injection is now thread-local, and this is a real gate.
      - name: Test the shipped Hypervisor daemon
        run: cargo test --locked -p ioi-node --bin hypervisor-daemon

      # M05.10 is a Rust-backed live-daemon gate. Keep it beside the daemon build and full daemon
      # test so the Node-only product job never invokes Cargo implicitly. The verifier refuses an
      # out-of-worktree binary and exercises only synthetic records on an isolated data directory.
      - name: Verify vertical ontology pack compilation
        env:
          IOI_M0510_DAEMON_PREBUILT: "1"
        run: npm run check:vertical-ontology-pack-compiler --workspace=@ioi/hypervisor-app

      # ADR 0038's named merge lane. The full daemon suite above also contains
      # these tests; the exact invocation keeps the M04.8 claim boundary visible
      # and prevents the scheduled real-wallet soak from drifting back into PR CI.
      - name: Verify the deterministic M04.8 architecture matrix
        run: npm --prefix apps/hypervisor run check:m4-room-participation-contribution-architecture

      - name: Verify passkey identity remains separate from effect authority
        run: |
          npm run check:device-custody-boundary
          npm run mutate:device-custody-boundary
          npm run check:secret-custody-profile
          npm run mutate:secret-custody-profile
          npm run check:standing-authority
          npm run mutate:standing-authority
          npm run test:authority-trajectory-admission
          npm run check:authority-trajectory-admission
          npm run mutate:authority-trajectory-admission

      # A green verifier certifies nothing until a MUTATION proves it red on its own finding. Every
      # anchor is a replayable second-admission path planted in the daemon's own source, with the
      # assertion it must turn red named beside it — and the harness re-derives the population pins
      # the mutant moves first, because a landing commit does, and a pin bump is not a property.
      # It runs HERE, in the Rust job, because each anchor is scored by a `cargo check --bin
      # hypervisor-daemon` that must be REAL: the daemon was just built and tested above, so the
      # target dir is warm and each check is incremental. The product_surfaces job installs no Rust
      # toolchain, so a cold full-daemon check there exits 101 with no rustc error line — which the
      # battery correctly reports as a BLOCKED compile check rather than as a passing run.
      - name: Replay the admission census mutation battery
        run: npm run mutate:ontology-admission-census --workspace=@ioi/hypervisor-app

      - name: Test the Agentgres substrate
        run: cargo test --locked -p agentgres

      - name: Publish the shipped Hypervisor daemon for live product smoke
        uses: actions/upload-artifact@v4
        with:
          name: hypervisor-daemon-linux-debug
          if-no-files-found: error
          path: |
            target/debug/hypervisor-daemon
            target/debug/mint-approval-grant

      - name: Smoke implementation-complete daemon paths
        run: npm run smoke:implementation-daemon

      - name: Publish implementation daemon smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: implementation-daemon-smoke-evidence
          include-hidden-files: true
          if-no-files-found: error
          path: .artifacts/implementation/daemon-smoke

      - name: Smoke the canonical package registry through restart
        run: npm run smoke:package-registry

      - name: Publish package registry smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-registry-smoke-evidence
          include-hidden-files: true
          if-no-files-found: error
          path: .artifacts/implementation/package-registry-smoke

      - name: Run tests
        uses: actions-rs/cargo@v1
        with:
          command: test
          args: --locked --all-features -p ioi-types -p ioi-api -p ioi-pii -p ioi-telemetry

      - name: Convergent Fault Tolerance Gates
        run: |
          cargo test --locked -p ioi-consensus --features aft guardian_majority_safety_holds_below_quorum_intersection_budget -- --nocapture
          cargo test --locked -p ioi-consensus --features aft experimental_nested_guardian_accepts_deterministically_assigned_witness_certificate -- --nocapture
          cargo test --locked -p ioi-services rejects_unsafe_odd_sized_guardian_committee_under_production_policy -- --nocapture
          cargo test --locked -p ioi-consensus --features aft boundary_ring_reference_trace_matches_committed_golden -- --nocapture

  # These verifiers are JavaScript orchestrators, but each intentionally
  # launches focused Cargo tests or a Rust extractor. Give that family its own
  # Rust-capable runner instead of extending the already-long build_and_test
  # gauntlet. Its census is merged later by verifier_family_floor, while the
  # independently running product_surfaces command graph remains Node-only.
  rust_backed_verifiers:
    name: Rust-backed product verifier family
    runs-on: ubuntu-latest
    # Interim hang ceiling only; verifier floors, not elapsed time, are the
    # acceptance doctrine.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install native deps for Rust-backed verification
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y \
            pkg-config \
            cmake \
            libdbus-1-dev \
            protobuf-compiler \
            libxcb1-dev \
            libxdo-dev

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: 1.93.1
          override: true

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Cache Rust-backed verifier dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-backed-verifiers-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # check:env-lease-authority boots target/debug/hypervisor-daemon. Build the
      # current checkout explicitly: a restored target/ is a cache, never proof
      # that the runnable daemon matches this revision.
      - name: Build the daemon the Rust-backed verifiers boot
        run: cargo build --locked -p ioi-node --bin hypervisor-daemon

      - name: Verify the Rust-backed product contract family
        env:
          IOI_VERIFIER_CENSUS_DIR: .artifacts/verifier-census
        run: |
          npm run check:env-lease-authority --workspace=@ioi/hypervisor-app
          npm run check:command-execution-guardrails --workspace=@ioi/hypervisor-app
          npm run check:enforcement-coverage-producer --workspace=@ioi/hypervisor-app
          npm run check:runtime-tool-contract-admission --workspace=@ioi/hypervisor-app
          npm run check:provider-proposal-provenance --workspace=@ioi/hypervisor-app
          npm run check:ontology-admission-census --workspace=@ioi/hypervisor-app
          npm run check:governed-effect-assurance-floor --workspace=@ioi/hypervisor-app

      - name: Publish the Rust-backed verifier census
        uses: actions/upload-artifact@v4
        with:
          name: rust-backed-verifier-census
          include-hidden-files: true
          if-no-files-found: error
          path: .artifacts/verifier-census

  # The two M04 plane verifiers are deliberately isolated from both existing
  # jobs. They build the current daemon, focused Rust tests, and the real
  # wallet.network authority fixture, so the Node-only product job cannot run
  # them. Keeping this as a parallel Rust job also avoids extending the already
  # serial build_and_test gauntlet. The 120-minute timeout is an interim hang
  # ceiling, not a performance target or accepted runtime doctrine; emitted
  # census artifacts retain the exact M04.9 floors for verifier_family_floor.
  m4_plane_verifiers:
    name: M04 daemon-backed plane verifier (${{ matrix.verifier_id }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - verifier_id: goalrun-activation-plane
          - verifier_id: outcome-room-system-spine
    # Each matrix entry gets a separate runner and 120-minute interim hang
    # ceiling. This is not a performance threshold or accepted runtime doctrine.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install native deps for daemon-backed verification
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y \
            pkg-config \
            cmake \
            libdbus-1-dev \
            protobuf-compiler \
            libxcb1-dev \
            libxdo-dev \
            bubblewrap

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: 1.93.1
          override: true

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Cache M04 verifier dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-m4-plane-cargo-${{ matrix.verifier_id }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-m4-plane-cargo-${{ matrix.verifier_id }}-
            ${{ runner.os }}-cargo-

      - name: Prebuild the daemon, signer, and wallet fixture binaries
        run: |
          cargo build --locked -p ioi-node --bin hypervisor-daemon --bin mint-approval-grant
          cargo test --locked --release -p ioi-cli --test hypervisor_wallet_network_fixture --no-run
          # The fixture builds this exact feature set in a separate FNV-1a-keyed
          # target directory during readiness. Populate it before the verifier
          # starts so a cold compile cannot consume its readiness ceiling.
          NODE_FEATURES="validator-bins,consensus-aft,state-iavl,commitment-hash,vm-wasm"
          NODE_DIR="target/test-node-builds/release-$(python3 - "$NODE_FEATURES" <<'PYEOF'
          import sys
          value = 0xcbf29ce484222325
          for byte in sys.argv[1].encode():
              value ^= byte
              value = (value * 0x100000001b3) & 0xFFFFFFFFFFFFFFFF
          print(f"{value:016x}")
          PYEOF
          )"
          CARGO_TARGET_DIR="$NODE_DIR" cargo build --locked --release -p ioi-node \
            --no-default-features --features "$NODE_FEATURES"

      - name: Install the exact Outcome adapter
        if: matrix.verifier_id == 'outcome-room-system-spine'
        run: |
          npm install --global opencode-ai@1.18.25
          test "$(opencode --version)" = "1.18.25"
          command -v bwrap
          bwrap --version

      - name: Cache the exact Outcome model
        if: matrix.verifier_id == 'outcome-room-system-spine'
        uses: actions/cache@v3
        with:
          path: ~/.ollama/models
          key: ollama-qwen2.5-7b-845dbda0ea48

      - name: Provision the exact Outcome model route
        if: matrix.verifier_id == 'outcome-room-system-spine'
        run: |
          curl -fsSL https://ollama.com/install.sh | OLLAMA_VERSION=0.18.3 sh
          # A freshly installed client can print a transient server-connect warning before its
          # version line. Parse the client version line itself instead of comparing every token
          # emitted by the command substitution, while retaining the exact-version refusal.
          OLLAMA_CLIENT_VERSION="$(ollama --version 2>&1 | sed -n 's/^ollama version is //p' | tail -n 1)"
          echo "installed Ollama client version: ${OLLAMA_CLIENT_VERSION:-absent}"
          test "$OLLAMA_CLIENT_VERSION" = "0.18.3"
          nohup ollama serve > /tmp/ollama-serve.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null && break
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/ollama-serve.log
              exit 1
            fi
            sleep 2
          done
          ollama pull qwen2.5:7b
          node - <<'NODEEOF'
          const response = await fetch("http://127.0.0.1:11434/api/tags");
          if (!response.ok) throw new Error(`ollama tags returned ${response.status}`);
          const tags = await response.json();
          const model = tags.models?.find((entry) => entry.name === "qwen2.5:7b");
          const expected = "845dbda0ea48ed749caafd9e6037047aa19acfcfd82e704d7ca97d631a0b697e";
          if (model?.digest !== expected) {
            throw new Error(`qwen2.5:7b digest ${model?.digest ?? "absent"} != ${expected}`);
          }
          NODEEOF

      # Keep both literal npm commands visible to check:verifier-floors. Each
      # matrix runner executes exactly one mutually exclusive step.
      - name: Verify the GoalRun activation plane
        if: matrix.verifier_id == 'goalrun-activation-plane'
        env:
          IOI_VERIFIER_CENSUS_DIR: .artifacts/verifier-census
          IOI_WALLET_FIXTURE_READY_TIMEOUT_MS: 1200000
          IOI_WORKLOAD_GRPC_TIMEOUT_MS: 120000
          IOI_ISOLATED_DAEMON_READY_TIMEOUT_MS: 120000
          IOI_WALLET_FIXTURE_RELEASE: "1"
        run: npm run check:m4-goalrun-activation-plane --workspace=@ioi/hypervisor-app

      - name: Verify the OutcomeRoom/System spine
        if: matrix.verifier_id == 'outcome-room-system-spine'
        env:
          IOI_VERIFIER_CENSUS_DIR: .artifacts/verifier-census
          IOI_WALLET_FIXTURE_READY_TIMEOUT_MS: 1200000
          IOI_WORKLOAD_GRPC_TIMEOUT_MS: 120000
          IOI_ISOLATED_DAEMON_READY_TIMEOUT_MS: 120000
          IOI_WALLET_FIXTURE_RELEASE: "1"
        run: |
          # Re-establish the loopback model route in the same step in case the
          # runner reaped a process backgrounded by the provisioning step.
          if ! curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
            nohup ollama serve > /tmp/ollama-serve-verifier.log 2>&1 &
            for attempt in $(seq 1 30); do
              curl -fsS http://127.0.0.1:11434/api/tags >/dev/null && break
              if [ "$attempt" -eq 30 ]; then
                cat /tmp/ollama-serve-verifier.log
                exit 1
              fi
              sleep 2
            done
          fi
          npm run check:m4-outcome-room-system-spine --workspace=@ioi/hypervisor-app

      - name: Publish the M04 plane verifier census
        uses: actions/upload-artifact@v4
        with:
          name: m4-plane-verifier-census-${{ matrix.verifier_id }}
          include-hidden-files: true
          if-no-files-found: error
          path: .artifacts/verifier-census

  product_surfaces:
    name: Product builds and browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Product work needs only the daemon artifact. Rust-backed and M04 verifier
    # families run beside it; a small final job merges all census artifacts.
    needs: build_and_test
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Download the built Hypervisor daemon
        uses: actions/download-artifact@v4
        with:
          name: hypervisor-daemon-linux-debug
          path: target/debug

      - name: Make the downloaded daemon executable
        run: chmod +x target/debug/hypervisor-daemon target/debug/mint-approval-grant

      - name: Install browser runtime
        run: npx playwright install --with-deps chromium

      # `check:architecture-contracts` is deliberately NOT repeated here. It shells out to the
      # pinned rustfmt toolchain, and this job installs only Node — so it could never pass in this
      # job, and this step has been failing for exactly that reason. The check already runs in
      # `build_and_test`, which this job `needs:`, so repeating it adds a full Rust toolchain
      # install to a Node-only job for no additional signal.
      - name: Verify product client contracts
        run: |
          npm run check:shipped-products
          npm run test:shipped-products
          npm run test:hypervisor-scm-publication-client
          npm run test:hypervisor-domain-app-runtime
          npm run test:hypervisor-app-harness
          npm run test:vite-production-authority-scan
          npm run test:smoke-fence
          npm run test:product-shell-auth --workspace=@ioi/hypervisor-app

      - name: Test marketplace authority, lifecycle, and recovery contracts
        run: |
          npm test --workspace=apps/aiagent-xyz
          npm test --workspace=apps/sas-xyz
          npm run check --workspace=apps/sas-xyz

      - name: Build every shipped JavaScript product and package
        run: npm run build:all

      - name: Verify developer documentation contracts and built routes
        run: |
          npm run validate:live --workspace=apps/developers-ioi-ai
          npm run validate:seo --workspace=apps/developers-ioi-ai
          npm run smoke:routes --workspace=apps/developers-ioi-ai

      - name: Verify marketplace source graphs and built authority boundaries
        run: |
          npm run check:production --workspace=apps/aiagent-xyz
          npm run check:production --workspace=apps/sas-xyz

      - name: Typecheck JavaScript workspaces
        run: npm run typecheck

      - name: Lint JavaScript workspaces
        run: npm run lint

      - name: Verify the ported Hypervisor seed and source-neutral boundary
        env:
          IOI_VERIFIER_CENSUS_DIR: .artifacts/verifier-census
        run: |
          npm run check:owned-product-ui --workspace=@ioi/hypervisor-app
          npm run check:shell-parity --workspace=@ioi/hypervisor-app
          npm run check:ported-seed --workspace=@ioi/hypervisor-app
          npm run check:seed-provenance --workspace=@ioi/hypervisor-app
          npm run check:source-neutral --workspace=@ioi/hypervisor-app

      # IOI_VERIFIER_CENSUS_DIR makes each verifier write the runtime assertion
      # census consumed by verifier_family_floor. Missing evidence fails closed.
      - name: Verify the first surface journeys against an isolated live daemon
        env:
          IOI_VERIFIER_CENSUS_DIR: .artifacts/verifier-census
        run: |
          npm run check:ontology-journey --workspace=@ioi/hypervisor-app
          npm run check:governance-journey --workspace=@ioi/hypervisor-app
          npm run check:studio-journey --workspace=@ioi/hypervisor-app
          npm run check:packages-journey --workspace=@ioi/hypervisor-app
          npm run check:automations-journey --workspace=@ioi/hypervisor-app
          npm run check:odk-contract-and-domainapp --workspace=@ioi/hypervisor-app
          npm run check:skill-contracts --workspace=@ioi/hypervisor-app
          npm run check:goal-profile-contracts --workspace=@ioi/hypervisor-app
          npm run check:m3-goalrun-plane --workspace=@ioi/hypervisor-app
          npm run check:m4-work-lifecycle-plane --workspace=@ioi/hypervisor-app
          npm run check:launch-chain --workspace=@ioi/hypervisor-app
          npm run check:session-authority --workspace=@ioi/hypervisor-app
          npm run check:landing-designations --workspace=@ioi/hypervisor-app
          npm run check:projects-saga --workspace=@ioi/hypervisor-app
          npm run check:provider-transport --workspace=@ioi/hypervisor-app
          npm run check:model-route-authority --workspace=@ioi/hypervisor-app
          npm run check:model-router-decisions --workspace=@ioi/hypervisor-app
          npm run check:backup-restore --workspace=@ioi/hypervisor-app
          npm run check:environment-custody --workspace=@ioi/hypervisor-app
          npm run check:operational-depth --workspace=@ioi/hypervisor-app
          npm run check:ontology-backend-families --workspace=@ioi/hypervisor-app
          npm run check:named-gap-truth --workspace=@ioi/hypervisor-app

      - name: Verify the product-shell safety and native-container contracts
        env:
          IOI_VERIFIER_CENSUS_DIR: .artifacts/verifier-census
        run: |
          product_data_dir=$(mktemp -d)
          IOI_HYPERVISOR_DATA_DIR="$product_data_dir" target/debug/hypervisor-daemon > /tmp/ioi-product-daemon.log 2>&1 &
          product_daemon_pid=$!
          npm run serve:product-ui --workspace=@ioi/hypervisor-app > /tmp/ioi-product-ui.log 2>&1 &
          product_ui_pid=$!
          trap 'kill "$product_ui_pid" "$product_daemon_pid" 2>/dev/null || true; rm -r "$product_data_dir"' EXIT
          for attempt in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:4173/__ioi/applications >/dev/null && break
            if [ "$attempt" -eq 60 ]; then
              cat /tmp/ioi-product-daemon.log
              cat /tmp/ioi-product-ui.log
              exit 1
            fi
            sleep 1
          done
          npm run check:app-runtime-safety --workspace=@ioi/hypervisor-app
          npm run check:native-shell --workspace=@ioi/hypervisor-app

      - name: Publish the Node product verifier census
        uses: actions/upload-artifact@v4
        with:
          name: product-verifier-census
          include-hidden-files: true
          if-no-files-found: error
          path: .artifacts/verifier-census

      - name: Record post-build shipped-product artifact identities
        run: |
          mkdir -p .artifacts/implementation/shipped-products
          for lane in \
            hypervisor-owned-served-ui \
            hypervisor-vite-workbench \
            hypervisor-web \
            developers-ioi-ai \
            aiagent-xyz \
            sas-xyz
          do
            node scripts/validate-shipped-products.mjs \
              --post-build \
              --lane "$lane" \
              --json > ".artifacts/implementation/shipped-products/$lane.json"
          done

      - name: Browser-smoke shipped product routes
        run: npm run smoke:product-surfaces

      # An ioi.ai web-UI block used to follow here. It was residue of the dual runtime removed under
      # the one-ioi.ai-app ruling, and it could not run: every step carried `../../../../` paths
      # written for a working directory four levels deep, but the block declared no
      # `working-directory`, so `chmod ../../../../target/debug/hypervisor-daemon` reached outside
      # the repo and failed. It also re-ran `npm ci` and re-downloaded the daemon artifact that this
      # job already has. Three of the scripts it invoked — `build`, `smoke:real-daemon`,
      # `smoke:browser` — exist neither at the repo root nor in apps/ioi-ai; the other two duplicate
      # the root `typecheck` and `test` already run above.
      #
      # So there is currently NO CI coverage of the ioi.ai web UI. That is a real gap, left open
      # deliberately rather than closed by guessing: `OQ-4` — whether the ioi.ai web UI ships, and
      # from which root — is an open question in the implementation guide, and inventing a
      # working-directory here would answer it by accident.

  # M06.1's deterministic gate on its own runner, beside the other verifier
  # families rather than inside them. It boots the daemon it just built and needs
  # no wallet fixture, model route, or network, so folding it into the M04 matrix
  # would make it pay for provisioning it does not use, and folding it into the
  # serial Rust-backed step would couple two unrelated families' runtimes.
  #
  # The expensive mutation adjudicator is deliberately outside blocking CI and
  # remains available through check:verified-work-graph:scheduled. Blocking CI
  # runs the deterministic producer/consumer/restart proof and publishes its
  # assertion census; scheduled qualification proves the same verifier goes red
  # on every planted target. The timeout below is an operational hang ceiling,
  # not a performance target.
  m061_verified_work_graph:
    name: M06.1 Verified Work Graph plane verifier
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install native deps for daemon-backed verification
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y \
            pkg-config \
            cmake \
            libdbus-1-dev \
            protobuf-compiler \
            libxcb1-dev \
            libxdo-dev

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: 1.93.1
          override: true

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Cache M06.1 verifier dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-m061-verified-work-graph-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # A restored target/ is a cache, never proof that the runnable daemon
      # matches this revision. Build the current checkout explicitly.
      - name: Build the daemon this verifier boots
        run: cargo build --locked -p ioi-node --bin hypervisor-daemon

      # The registered contract, its invariant profile and its fixture corpus are
      # checked with no daemon present, because the offline half has to hold for a
      # relying party who has only the bytes.
      - name: Verify the registered contract projections are current
        run: npm run check:architecture-contracts

      - name: Verify the WorkResult resolver and graph projection focused tests
        run: |
          cargo test --locked -p ioi-node --bin hypervisor-daemon assurance_transition_routes::tests
          cargo test --locked -p ioi-node --bin hypervisor-daemon work_result_routes::work_result_tests

      - name: Verify the Verified Work Graph plane
        env:
          IOI_VERIFIER_CENSUS_DIR: .artifacts/verifier-census
        run: npm run check:verified-work-graph --workspace=@ioi/hypervisor-app

      - name: Publish the M06.1 verifier census
        uses: actions/upload-artifact@v4
        with:
          name: m061-verified-work-graph-census
          include-hidden-files: true
          if-no-files-found: error
          path: .artifacts/verifier-census

  # Every verifier is pinned at the assertion count it actually executed. This
  # final job starts only after the independent Node, Rust-backed, M04, and M06.1
  # jobs publish their immutable censuses. It invokes no verifier, Cargo build,
  # daemon, or authority path; omission and shrinkage fail closed here.
  # Timeout-graph ceiling (not a performance claim): max(build 90 + product 45,
  # Rust-backed 90, either parallel M04 matrix leg 120, M06.1 90) + floor 20 =
  # 155 minutes. The M06.1 job remains parallel, so the graph maximum is
  # unchanged.
  verifier_family_floor:
    name: Verifier family census floor
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      [
        product_surfaces,
        rust_backed_verifiers,
        m4_plane_verifiers,
        m061_verified_work_graph,
      ]
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Download the Node product verifier census
        uses: actions/download-artifact@v4
        with:
          name: product-verifier-census
          path: .artifacts/verifier-census

      - name: Download the Rust-backed verifier census
        uses: actions/download-artifact@v4
        with:
          name: rust-backed-verifier-census
          path: .artifacts/verifier-census

      - name: Download both M04 plane verifier censuses
        uses: actions/download-artifact@v4
        with:
          pattern: m4-plane-verifier-census-*
          merge-multiple: true
          path: .artifacts/verifier-census

      - name: Download the M06.1 Verified Work Graph census
        uses: actions/download-artifact@v4
        with:
          name: m061-verified-work-graph-census
          path: .artifacts/verifier-census

      - name: Verify the verifier family did not shrink
        env:
          IOI_VERIFIER_CENSUS_DIR: .artifacts/verifier-census
        run: npm run check:verifier-floors --workspace=@ioi/hypervisor-app

  aft_formal_floor:
    name: AFT Formal Floor
    runs-on: ubuntu-latest
    # A clean cache must download the proof toolchain, discharge every TLAPS
    # obligation, and exhaust the registered TLC state spaces. The previous
    # 30-minute job cap cancelled that complete floor after all cheap gates had
    # passed; cancellation is neither a proof failure nor acceptable evidence.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The census is the floor: every .tla module under the AFT formal tree
      # must be either executed by the harness or carried in
      # manual-discharge.json with a reason. Cheap; runs on every build.
      - name: Formal census (no silent orphan modules)
        run: bash .github/scripts/run_aft_formal_checks.sh --census-only

      # This stdlib-only verifier is deliberately outside the Rust/IOI
      # implementation. Running its committed golden corpus from CI's clean
      # checkout prevents the independent evidence from disappearing behind
      # an ignore rule or existing only in an author's working tree.
      - name: AFT clean-room assurance golden corpus
        run: python3 tools/aft-assurance-cleanroom/verify.py

      # Claim discipline is part of the same floor: no unconditional or
      # rounded tolerance claim in the AFT corpus, and the whitepaper's
      # A1–A9 assumption ledger + interim conditional claim stay intact.
      # Both cheap; run on every build.
      - name: AFT claim discipline (no unconditional / rounded tolerance claims)
        run: bash .github/scripts/check_aft_claim_discipline.sh

      - name: Whitepaper assumption ledger + interim claim intact
        run: bash .github/scripts/check_aft_whitepaper_claims.sh

      # P1.2's machine convention: Assumes-line discipline over the
      # common-boundary theorem corpus (A5/A9/A10 scoping, T8 quarantine,
      # T1 timing denylist, pairing-table completeness).
      - name: Theorem Assumes discipline (common boundary)
        run: bash .github/scripts/check_aft_theorem_assumes.sh

      # R4c's gate: the release tree contains no mock succinct-proof
      # constructor, the succinct continuity lane has no simulated
      # fallback, and the driver pin matches the governed vkey.json.
      - name: No mock proof constructor (succinct lane real-or-refuse)
        run: bash .github/scripts/check_aft_no_mock_proof.sh

      - name: Determine whether formal sources changed
        id: formal_diff
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            RANGE="origin/${{ github.base_ref }}...HEAD"
          else
            BEFORE="${{ github.event.before }}"
            if [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]]; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            RANGE="$BEFORE..${{ github.sha }}"
          fi
          if git diff --name-only $RANGE -- \
              internal-docs/architecture/protocols/aft/formal \
              .github/scripts/run_aft_formal_checks.sh \
              | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Java for TLC
        if: steps.formal_diff.outputs.changed == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Full discharge (4 TLAPS proofs + 6 TLC models) runs when the formal
      # tree or the harness changed; the census above runs unconditionally.
      - name: Full formal discharge (proofs + models)
        if: steps.formal_diff.outputs.changed == 'true'
        run: bash .github/scripts/run_aft_formal_checks.sh
