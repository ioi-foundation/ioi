<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>decentralized.cloud</title>
  <link rel="stylesheet" href="/face.css">
</head>
<body>

  <!-- The first seven tab stops on every surface are the nav, so a keyboard reader
       walks them again on each one. -->
  <a class="skip" href="#surface">Skip to the surface</a>

  <header class="topbar">
    <div class="topbar-left">
      <div class="lockup">
        <!-- The family monogram, reversed white-on-onyx — the reduction an
             independent review rated the strongest of the drawings, because the
             counters open up and the three blocks separate optically where on a
             light ground they do not.
             The mark's ink height is 22px against a 22px wordmark: one em, which
             is 1.429 x the measured cap of 0.700 em. The tile is 31px because the
             ink occupies 68.51 of the tile's 96 units.
             This file is served verbatim, so everything written here ships in
             view-source. An independent review found the identity's blind score
             and an internal sheet path in the bytes a visitor receives — inside a
             comment asserting the label never reaches one. The identity's status
             now lives only in brand/identity-status.md, which is not served, and
             the gate checks the SERVED BYTES rather than comment-stripped source. -->
        <svg class="mark" width="31" height="31" viewBox="0 0 96 96" role="img" aria-label="decentralized.cloud">
          <defs>
            <mask id="cloud-cue" maskUnits="userSpaceOnUse" x="-20" y="-20" width="136" height="136">
              <rect x="-20" y="-20" width="136" height="136" fill="#ffffff"></rect>
              <rect x="65.38" y="24.03" width="15" height="6.2" rx="3.1" fill="#000000"></rect>
            </mask>
          </defs>
          <rect x="0" y="0" width="96" height="96" rx="11" fill="#0a0e19"></rect>
          <g mask="url(#cloud-cue)"><g transform="translate(9.500 13.743) scale(0.71369)">
            <path d="M 41.44 0.00 C 38.66 0.00 36.33 2.13 36.09 4.90 L 34.09 27.84 L 79.17 27.84 L 75.70 67.48 L 103.42 67.48 L 107.83 17.16 C 108.63 7.94 101.36 0.00 92.10 0.00 Z" fill="#ffffff"></path>
            <path d="M 10.57 27.84 C 7.79 27.84 5.46 29.97 5.22 32.75 L 3.14 56.51 L 26.66 56.51 C 29.45 56.51 31.77 54.39 32.01 51.61 L 34.09 27.84 Z" fill="#ffffff"></path>
            <path d="M 17.71 68.00 C 8.93 68.07 1.66 74.86 0.97 83.61 L 0.00 96.00 L 73.47 96.00 L 75.71 67.47 Z" fill="#ffffff"></path>
          </g></g>
        </svg>
        <!-- The Z is DRAWN, and only here.
             IOI Display's own Z (gid 30, U+005A and U+007A — the face is unicase)
             has a curved upper-left terminal and reads as a numeral 2: three
             reviewers who could not see each other's work read this wordmark as
             "DECENTRALI2ED", at both sizes, on the live surface and in every
             lockup. The brand's own name was being misspelled by its own typeface.
             This is NOT an edit to IOI.ttf. That file is the estate's brand face
             and other products set their wordmarks in it; whether the same misread
             exists there is the owner's call. One glyph is overridden, in one
             wordmark, and the font is untouched.
             Drawn to the face's own measurements, taken off a 300px render rather
             than assumed: cap 700 units, bar 140, stem 137, advance 1065, side
             bearings 32 and 1033 — the face's own Z bearings, so the fitting does
             not change. What differs from the face's Z, and what makes it a Z:
             square terminals on both bars, and a bottom bar that runs the full
             width. The diagonal is cut 1.7x the bar horizontally, because a
             diagonal at a horizontal's numeric weight reads lighter.
             The 1.7 replaced a 1.35 on 2026-09-04, chosen by a swept round rather
             than by a redraw: twenty variants shown to three fresh readers as the
             cluster "alized" alone, at a true 13px and 16px. All three typed a
             DIGIT for exactly one variant — the face's own Z — and this is the only
             variant all three placed in their best group. The mechanism they named
             is a corner, not a terminal: "it is a bend versus a corner, and at 13px
             the bend wins."
             Owner-reversible; recorded in brand/identity-status.md.
             This path is NOT free to drift: brand/wordmark/wordmark.mjs is its one
             source and the face gate asserts the SERVED bytes carry exactly that
             value. Before 2026-09-04 that sentence was written here and in
             wordmark.mjs and enforced by neither — a convention that read as a
             guarantee. The gate now exists.
             The face carries no U+002E either, which is why the period has always
             had to be drawn. -->
        <div class="wordmark" style="font-size: 22px;" aria-hidden="true">
          <span>decentrali</span><svg class="wm-z" viewBox="0 -700 1065 700" aria-hidden="true"
            focusable="false"><g transform="scale(1,-1)"><path
            d="M 32 700 L 1033 700 L 1033 560 L 270 140 L 1033 140 L 1033 0 L 32 0 L 32 140 L 795 560 L 32 560 Z"
            fill="currentColor"></path></g></svg><span>ed</span><span class="dot"></span><span>cloud</span>
        </div>
      </div>
      <nav class="nav" aria-label="Surfaces">
        <button type="button" data-surface="candidates" aria-current="page">Candidates</button>
        <button type="button" data-surface="sources">Sources</button>
        <button type="button" data-surface="placement">Placement</button>
        <button type="button" data-surface="job">Submit a job</button>
        <button type="button" data-surface="redundancy">Redundancy</button>
        <button type="button" data-surface="receipts">Receipts</button>
        <button type="button" data-surface="api">API</button>
      </nav>
    </div>
    <div class="topbar-status">
      <span class="meta" id="daemon-label">daemon —</span>
      <span class="chip muted" id="refresh-chip"><span class="dot"></span>read-only surface</span>
    </div>
  </header>

  <!-- `aria-live` used to sit on <main> itself, so every surface swap re-announced
       the entire page — and on Placement that was 13.66 MB of text. Shrinking
       Placement to 890 characters removed the magnitude but not the fault: a live
       region should announce WHAT CHANGED, not read the document. The region is now
       a one-line status that names the surface and its headline count, and the
       surface itself is an ordinary landmark again. -->
  <p id="surface-status" class="sr-only" role="status" aria-live="polite"></p>

  <!-- `tabindex="-1"` because the skip link above is inert without it: a browser will
       not move focus to an element that cannot receive it, so pressing Enter on the
       link left activeElement on BODY and the reader walked the same seven nav stops
       again. A review found the mitigation broken while the comment explaining why it
       existed sat directly above it. -->
  <main id="surface" tabindex="-1">
    <p class="prose">Asking the daemon.</p>
  </main>

  <script type="module" src="/face.js"></script>
</body>
</html>
