<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>decentralized.cloud</title>
  <link rel="stylesheet" href="/face.css">
</head>
<body>

  <header class="topbar">
    <div class="topbar-left">
      <div class="wordmark" style="font-size: 22px;" aria-label="decentralized.cloud">
          <span>decentralized</span><span class="dot"></span><span>cloud</span>
        </div>
      <nav class="nav" aria-label="Surfaces">
        <button type="button" data-surface="candidates" aria-current="page">Candidates</button>
        <button type="button" data-surface="sources">Sources</button>
        <button type="button" data-surface="placement">Placement</button>
        <button type="button" data-surface="job">Submit a job</button>
        <button type="button" data-surface="api">API</button>
      </nav>
    </div>
    <div style="display: flex; align-items: center; gap: 14px;">
      <span class="meta" id="daemon-label">daemon —</span>
      <span class="chip muted"><span class="dot"></span>read-only surface</span>
    </div>
  </header>

  <main id="surface" aria-live="polite">
    <p class="prose">Asking the daemon.</p>
  </main>

  <script type="module" src="/face.js"></script>

</html>
