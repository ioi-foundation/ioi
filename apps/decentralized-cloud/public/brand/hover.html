<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>decentralized.cloud — the hover cloud</title>
<!-- THE OWNER'S HOVER CLOUD, verbatim in geometry and timing (cloud-hover.html,
     2026-09-06). The cloud is four circles and a rect; moving the pointer across it
     opens a column where the cloud dissolves into a network of connected squares.
     Two changes from the owner's file, both colour: the flat prototype blue is the
     brand gradient (--color-dc-mark-indigo → --color-dc-mark-cyan, bottom-left to
     top-right) and the ground is substrate navy. Nothing else is edited. This is the
     web hero treatment; the static mark on /brand/ is this cloud with the network
     knocked out, drawn from the same four circles and rect in brand/mark/mark.mjs. -->
<style>
  :root { --bg: #000c26; --hint: rgba(255, 255, 255, 0.5); }
  html, body { margin: 0; height: 100%; background: var(--bg); }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
  canvas { width: min(96vw, 900px); height: auto; max-width: 100%; display: block; touch-action: none; }
  p { margin: 0; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--hint); transition: opacity .6s; }
  @media (prefers-reduced-motion: reduce) { p { display: none; } }
</style>
</head>
<body>
<canvas id="c" width="665" height="384" aria-label="A cloud; hovering over it dissolves that part into a network of connected squares"></canvas>
<p id="hint">Move your pointer across the cloud</p>

<script>
(function () {
  const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  const W = 665, H = 384;
  const hint = document.getElementById('hint');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Whole cloud, centred in the scene
  const C = [[188,264,66],[268,198,82],[338,160,96],[488,250,82]];
  const R = { x0: 188, x1: 488, y0: 198, y1: 330 };
  // The brand gradient across the cloud's own box, bottom-left to top-right.
  const grad = ctx.createLinearGradient(122, 332, 570, 64);
  grad.addColorStop(0, '#3f3dfa'); grad.addColorStop(1, '#41dbf9');
  const BLUE = grad;
  const inCloud = (x, y) => C.some(([cx,cy,r]) => (x-cx)**2 + (y-cy)**2 <= r*r) || (x >= R.x0 && x <= R.x1 && y >= R.y0 && y <= R.y1);
  const topAt = x => { let t = Infinity; for (const [cx,cy,r] of C) { const dx = x - cx; if (Math.abs(dx) <= r) t = Math.min(t, cy - Math.sqrt(r*r - dx*dx)); } if (x >= R.x0 && x <= R.x1) t = Math.min(t, R.y0); return t; };
  const bottomAt = x => { let b = -Infinity; for (const [cx,cy,r] of C) { const dx = x - cx; if (Math.abs(dx) <= r) b = Math.max(b, cy + Math.sqrt(r*r - dx*dx)); } if (x >= R.x0 && x <= R.x1) b = Math.max(b, R.y1); return b; };
  function drawCloud() { ctx.fillStyle = BLUE; ctx.beginPath(); for (const [cx,cy,r] of C) { ctx.moveTo(cx + r, cy); ctx.arc(cx, cy, r, 0, Math.PI * 2); } ctx.rect(R.x0, R.y0, R.x1 - R.x0, R.y1 - R.y0); ctx.fill(); }

  const HW = 95, ZONE = 70, U = 45;
  const clamp01 = x => Math.max(0, Math.min(1, x));
  const lerp = (a, b, t) => a + (b - a) * t;
  const easeOut = x => 1 - Math.pow(1 - x, 3);
  let seed = 23; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;

  const lattice = [];
  for (let gx = 100; gx <= 580; gx += 8) for (let gy = 56; gy <= 340; gy += 8) {
    const x = gx + (rnd() - .5) * 3, y = gy + (rnd() - .5) * 3, r = rnd(), sz = 0.75 + rnd() * 0.5;
    if (inCloud(x + 4, y + 4)) lattice.push({ x, y, r, sz });
  }

  const hubs = [[-.72,.02],[.66,.1],[-.05,.3],[-.78,.5],[.74,.56],[.06,.7],[-.62,.96],[.7,.99]];
  const sats = [[-1.3,.14,0],[-1.32,.5,3],[-1.28,.86,6],[1.3,.2,1],[1.32,.55,4],[1.28,.9,7]];
  const edges = [[0,1],[0,2],[1,2],[0,3],[1,4],[2,3],[2,4],[3,5],[4,5],[3,6],[4,7],[5,6],[5,7]];
  const tmpl = hubs.map(([u,v]) => ({ u, v, s: 21, sat: false })).concat(sats.map(([u,v,h]) => ({ u, v, s: 10, sat: true, hub: h })));
  tmpl.forEach(n => n.t0 = 0.2 + Math.abs(n.u) * 0.3);
  const fibers = tmpl.filter(n => n.sat).flatMap(n => [-15, 0, 15].map(dy => ({ n, dy: dy + (rnd() - .5) * 8, dx: 8 + rnd() * 22 })));

  let hovering = false, tx = W / 2, cx = W / 2, o = 0, last = 0;
  function pointer(e) {
    const b = canvas.getBoundingClientRect();
    const x = (e.clientX - b.left) / b.width * W, y = (e.clientY - b.top) / b.height * H;
    const over = x > 110 && x < 580 && y > topAt(Math.max(125, Math.min(565, x))) - 30 && y < 345;
    hovering = over;
    if (over) { tx = Math.max(150, Math.min(474, x)); hint.style.opacity = 0; }
  }
  canvas.addEventListener('pointermove', pointer);
  canvas.addEventListener('pointerdown', pointer);
  canvas.addEventListener('pointerleave', () => hovering = false);

  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000) || 0; last = now;
    o += ((hovering ? 1 : 0) - o) * Math.min(1, dt * (hovering ? 5 : 4));
    cx += (tx - cx) * Math.min(1, dt * 9);
    const ch = HW * easeOut(clamp01(o / 0.7));
    const L = cx - ch, Rr = cx + ch;

    ctx.clearRect(0, 0, W, H);
    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, L, H); ctx.rect(Rr, 0, W - Rr, H); ctx.clip(); drawCloud(); ctx.restore();
    if (o < 0.01) { requestAnimationFrame(frame); return; }

    const st = tmpl.map(n => {
      const x = cx + n.u * U, top = topAt(x), bot = bottomAt(x);
      if (!isFinite(top)) return { x, y: 0, k: 0 };
      const y = lerp(top + 18, bot - 16, n.v);
      const q = clamp01((o - n.t0) / 0.3);
      let k = q < .6 ? easeOut(q / .6) * 1.2 : lerp(1.2, 1, (q - .6) / .4);
      k *= clamp01((ch - Math.abs(n.u * U) - 6) / 16);
      return { x, y, k, settle: clamp01((o - n.t0 - 0.2) / 0.3) };
    });

    ctx.fillStyle = BLUE; const vis = [];
    for (const p of lattice) {
      const mid = p.x + 4; if (mid <= L || mid >= Rr) continue;
      const depth = Math.min(mid - L, Rr - mid), u = depth / ZONE; if (u > 1) continue;
      if (p.r > Math.pow(1 - u, 1.5)) continue;
      let clash = false;
      for (let i = 0; i < st.length; i++) { const n = st[i]; if (n.k > 0 && Math.abs(n.x - mid) < tmpl[i].s / 2 + 6 && Math.abs(n.y - (p.y + 4)) < tmpl[i].s / 2 + 6) { clash = true; break; } }
      if (clash) continue;
      const s = lerp(8, 3, u) * p.sz;
      ctx.fillRect(p.x + (8 - s) / 2, p.y + (8 - s) / 2, s, s);
      vis.push({ x: mid, y: p.y + 4 });
    }

    ctx.strokeStyle = BLUE; ctx.lineWidth = 1.7; ctx.lineCap = 'round';
    for (const f of fibers) {
      const i = tmpl.indexOf(f.n), S = st[i]; if (S.k <= 0) continue;
      const dir = Math.sign(f.n.u), wx = cx + dir * (ch - f.dx), wy = S.y + f.dy;
      let ex = 0, ey = 0, best = 400;
      for (const v of vis) { if (Math.sign(v.x - cx) !== dir || Math.abs(v.x - S.x) < 12) continue; const d = (v.x - wx) ** 2 + (v.y - wy) ** 2; if (d < best) { best = d; ex = v.x; ey = v.y; } }
      if (best >= 400) continue;
      ctx.globalAlpha = 0.9 * Math.min(1, S.k) * S.settle;
      ctx.beginPath(); ctx.moveTo(S.x, S.y); ctx.bezierCurveTo(S.x + dir * 14, S.y, ex - dir * 14, ey, ex, ey); ctx.stroke();
    }
    ctx.globalAlpha = 1;

    const links = edges.concat(tmpl.map((n, i) => n.sat ? [i, n.hub, true] : null).filter(Boolean));
    for (const [a, b, thin] of links) {
      const A = st[a], B = st[b], k = Math.min(A.settle || 0, B.settle || 0);
      if (!(A.k > 0 && B.k > 0) || k <= 0) continue;
      ctx.lineWidth = thin ? 1.8 : 2.6; ctx.globalAlpha = Math.min(A.k, B.k, 1);
      ctx.beginPath(); ctx.moveTo(A.x, A.y); ctx.lineTo(lerp(A.x, B.x, easeOut(k)), lerp(A.y, B.y, easeOut(k))); ctx.stroke();
    }
    ctx.globalAlpha = 1;

    ctx.fillStyle = BLUE;
    st.forEach((s, i) => { if (s.k <= 0) return; const sz = tmpl[i].s * s.k; ctx.beginPath(); ctx.roundRect(s.x - sz / 2, s.y - sz / 2, sz, sz, tmpl[i].sat ? 2 : 4); ctx.fill(); });

    requestAnimationFrame(frame);
  }

  const dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = W * dpr; canvas.height = H * dpr; ctx.scale(dpr, dpr);
  // Reduced motion: the closed cloud, drawn once, and the pointer opens nothing.
  if (reduce) { drawCloud(); return; }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
