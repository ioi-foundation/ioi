[package]
name = "aft-pq-crypto-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
bincode = "1.3.3"
ioi-api = { path = "../../crates/api" }
ioi-crypto = { path = "../../crates/crypto" }
ioi-types = { path = "../../crates/types" }
ioi-validator = { path = "../../crates/validator" }
libfuzzer-sys = "0.4"
tempfile = "3.3"

[[bin]]
name = "aft_pq_decoders"
path = "fuzz_targets/aft_pq_decoders.rs"
test = false
doc = false
bench = false

[[bin]]
name = "aft_seal_signer_state"
path = "fuzz_targets/aft_seal_signer_state.rs"
test = false
doc = false
bench = false

[workspace]
